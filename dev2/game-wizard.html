          wrap.appendChild(playerHost);
          const thisClipIndex = filmClipIndex;
          ensureYouTubeApi().then(function(){
            // Bail if the panel's moved on since this resolved (clip
            // switched, panel rebuilt) -- don't attach a player to a
            // host that's no longer the one currently on screen.
            if (filmClipIndex !== thisClipIndex || !document.getElementById('filmPlayer')) return;
            ytPlayer = new YT.Player('filmPlayer', { videoId: embed.videoId, playerVars: { playsinline: 1 } });
          });
          appendPlayPauseControls(wrap, function(){ if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo(); }, function(){ if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); });
        } else if (embed && embed.kind === 'drive'){
          // Nathan: "this whole feature isn't working well." The direct-
          // video-file technique (driveDirectVideoUrl -> native <video>)
          // just failed with a real, specific error -- "source not
          // supported/blocked" -- most likely Google Drive's own virus-
          // scan/large-file interstitial page coming back instead of
          // actual video bytes when hit this way. Reverting to the plain
          // /preview embed Google's own viewer uses, which reliably
          // displays the video -- the tradeoff is losing programmatic
          // control (no auto-capturing a timestamp, no auto-seek in
          // Playback for Drive-hosted film specifically), but a working,
          // simple video beats a broken, fancier one.
          const iframe = document.createElement('iframe');
          iframe.src = embed.previewUrl; iframe.allow = 'autoplay; encrypted-media; picture-in-picture'; iframe.allowFullscreen = true;
          iframe.style.cssText = 'width:100%;height:min(38vh,320px);border:0;border-radius:10px;margin-top:8px;background:#000;display:block;';
          wrap.appendChild(iframe);
          const hint = document.createElement('div'); hint.className = 'sub'; hint.style.margin = '6px 0 0';
          hint.textContent = 'Use the play/pause controls built into the video above -- this embed can\'t be driven by a separate button, so timestamps can\'t be auto-captured for this film.';
          wrap.appendChild(hint);
        } else {
          const openLink = document.createElement('a'); openLink.href = clip.url; openLink.target = '_blank'; openLink.rel = 'noopener';
          openLink.className = 'primaryBtn'; openLink.style.cssText = 'display:block;text-align:center;text-decoration:none;margin-top:8px;';
          openLink.textContent = '▶️ Open ' + (clip.title || 'Film') + ' in a New Tab';
          wrap.appendChild(openLink);
          const hint = document.createElement('div'); hint.className = 'sub'; hint.style.margin = '6px 0 0';
          hint.textContent = "This host doesn't allow embedding -- on a tablet, use your OS's split-view/split-screen to keep this open next to the Wizard.";
          wrap.appendChild(hint);
        }
      }
    }
    host.appendChild(wrap);
  }
  // Nathan: "setting markers at the end of each play so there is a link
  // between the plays and the clip." Reads the video's real current
  // timestamp at the moment a play is actually committed (see
  // commitCurrentPlay's use of this) -- no separate "mark this moment"
  // button to remember to press, the natural instant a play gets logged
  // IS the marker.
  // Nathan: "this whole feature isn't working well" -- Drive is back to a
  // plain /preview embed (see embeddableFilmSrc), which can't be read
  // programmatically at all, so only YouTube can actually have a
  // timestamp captured right now.
  function getCurrentFilmTime(){
    if (filmKind === 'youtube' && ytPlayer && typeof ytPlayer.getCurrentTime === 'function'){
      try { const t = ytPlayer.getCurrentTime(); return (typeof t === 'number' && !isNaN(t)) ? t : null; } catch(e){ return null; }
    }
    return null;
  }

  // Nathan: "I am only worried about what we ran as going forward, the
  // coach on the sideline doing the play calls won't be visible." Reusing
  // Stat Keeper's log while watching film back means there's no sideline
  // signal to compare against -- this skips straight to "what actually
  // happened" every time instead of asking once per play.
  // Nathan (follow-up): "we instructed the camera man to not show the play
  // calls on the sideline so we won't ever know what play was called."
  // Confirms this isn't a one-off for a single review session -- it's how
  // every game from here on will be filmed. Defaulting from localStorage
  // (and saving whenever it's toggled) means it's just already on the next
  // time the Wizard opens, instead of a switch to remember to flip every
  // single game.
  let filmReviewMode = (function(){ try { return localStorage.getItem('bengalsWizardFilmReview') === '1'; } catch(e){ return false; } })();

  function renderPlayLoopStep(area){
    ensureFilmPanelBuilt();

    const header = document.createElement('div');
    header.innerHTML = renderGameHeaderHtml();
    area.appendChild(header);
    renderRecentPlaysPanel(area);

    const utilRow = document.createElement('div'); utilRow.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;';
    const toBtn = document.createElement('button'); toBtn.className = 'ghostBtn'; toBtn.style.margin = '0'; toBtn.textContent = '⏱ Timeout';
    toBtn.addEventListener('click', function(){ logEvent('timeout'); });
    const eqBtn = document.createElement('button'); eqBtn.className = 'ghostBtn'; eqBtn.style.margin = '0'; eqBtn.textContent = '🏁 End Quarter';
    eqBtn.addEventListener('click', function(){ logEvent('quarterEnd'); });
    // Nathan: "give me the option to Save the Current Stat Keeper for that
    // game as a work in progress." Every play is already saved to Firebase
    // the instant it's logged (this button doesn't change that), but
    // there was never a way to mark a game as "still being worked on"
    // instead of finished -- this stamps the game record with that status
    // so it's not confused for a completed stat sheet if you have to walk
    // away mid-game and pick it back up later.
    const wipBtn = document.createElement('button'); wipBtn.className = 'ghostBtn'; wipBtn.style.margin = '0'; wipBtn.textContent = '💾 Save as Work in Progress';
    wipBtn.addEventListener('click', saveAsWorkInProgress);
    utilRow.appendChild(toBtn); utilRow.appendChild(eqBtn); utilRow.appendChild(wipBtn);
    area.appendChild(utilRow);

    const reviewToggle = document.createElement('div');
    reviewToggle.className = 'optChip' + (filmReviewMode ? ' active' : '');
    reviewToggle.style.cssText = 'display:inline-block;padding:6px 12px;font-size:11.5px;margin-bottom:14px;';
    reviewToggle.textContent = '🎬 Reviewing Film (skip play-call check)';
    reviewToggle.addEventListener('click', function(){
      filmReviewMode = !filmReviewMode;
      try { localStorage.setItem('bengalsWizardFilmReview', filmReviewMode ? '1' : '0'); } catch(e){}
      renderWizard();
    });
    area.appendChild(reviewToggle);

    if (wiz.game.possession === 'Us' && wiz.play.phase === 'callCheck' && filmReviewMode) wiz.play.phase = 'playType';

    const card = document.createElement('div'); card.className = 'card';
    const phase = wiz.play.phase;
    if (phase === 'firstDownToast') renderPhaseFirstDownToast(card);
    else if (wiz.game.possession === 'Us' && phase === 'callCheck') renderPhaseCallCheck(card);
    else if (wiz.game.possession === 'Us' && phase === 'calledPlay') renderPhaseCalledPlay(card);
    else if (phase === 'playType') renderPhasePlayType(card);
    else if (phase === 'runDetail') renderPhaseRunDetail(card);
    else if (phase === 'passDetail') renderPhasePassDetail(card);
    else if (phase === 'penaltyDetail') renderPhasePenaltyDetail(card);
    else if (phase === 'turnoverDetail') renderPhaseTurnoverDetail(card);
    else if (phase === 'puntDetail') renderPhasePuntDetail(card);
    else if (phase === 'resultSpot') renderPhaseResultSpot(card);
    else if (phase === 'tackler') renderPhaseTackler(card);
    else if (phase === 'extraPoint') renderPhaseExtraPoint(card);
    else if (phase === 'postScoreKickoff') renderPhasePostScoreKickoff(card);
    else if (phase === 'touchdown') renderPhaseTouchdown(card);
    area.appendChild(card);

    const fixLink = document.createElement('a');
    fixLink.href = 'stat-keeper.html?game=' + encodeURIComponent(selectedGame.id);
    fixLink.className = 'ghostBtn'; fixLink.style.cssText = 'display:block;text-align:center;text-decoration:none;';
    fixLink.textContent = '📋 Open in Stat Keeper (fix a mistake)';
    area.appendChild(fixLink);
  }

  function backBtn(container, toPhase){
    const b = document.createElement('button'); b.className = 'ghostBtn'; b.textContent = '← Back';
    b.addEventListener('click', function(){ wiz.play.phase = toPhase; renderWizard(); });
    container.appendChild(b);
  }

  // Nathan: "First is if we can see the play call. If yes, then select the
  // call. If no, then it proceeds to the play."
  function renderPhaseCallCheck(card){
    card.innerHTML = '<h2>🏈 We\'re on Offense</h2><div class="sub">Can you see the play call from the sideline?</div>';
    const row = document.createElement('div'); row.className = 'chipRow';
    [['yes','Yes, I can see it'], ['no',"No, just log what happened"]].forEach(function(pair){
      const c = document.createElement('div'); c.className = 'optChip'; c.textContent = pair[1];
      c.addEventListener('click', function(){
        wiz.play.phase = pair[0] === 'yes' ? 'calledPlay' : 'playType';
        renderWizard();
      });
      row.appendChild(c);
    });
    card.appendChild(row);
  }
  function renderPhaseCalledPlay(card){
    card.innerHTML = '<h2>📣 Coach\'s Call</h2><div class="sub">What got signaled in.</div>';
    chipGroupField(card, 'Formation', wiz.play, 'coachFormation', FORMATIONS);
    if (wiz.play.coachFormation) chipGroupField(card, 'Formation Direction', wiz.play, 'coachFormationDir', ['Left','Right']);
    chipGroupField(card, 'Play', wiz.play, 'coachCall', PLAYBOOK);
    if (wiz.play.coachCall) chipGroupField(card, 'Play Direction', wiz.play, 'coachCallDir', ['Left','Right']);
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = 'Continue →';
    next.addEventListener('click', function(){ wiz.play.phase = 'playType'; renderWizard(); });
    card.appendChild(next);
    backBtn(card, 'callCheck');
  }

  // Nathan: "You choose Run, Pass, Penalty, Turnover... On 4th down, it
  // should display an option for Punt... On defense, we won't have
  // anything to do with play calls, just if the offense did a run, pass or
  // punt."
  function renderPhasePlayType(card){
    const onOffense = wiz.game.possession === 'Us';
    card.innerHTML = '<h2>' + (onOffense ? '🏈 Choose the Play' : '🛡️ What Did They Run?') + '</h2>';
    const opts = onOffense ? ['Run','Pass','Penalty','Turnover'] : ['Run','Pass','Punt','Penalty','Turnover'];
    if (onOffense && wiz.game.down === 4) opts.push('Punt');
    const row = document.createElement('div'); row.className = 'chipRow';
    opts.forEach(function(t){
      const c = document.createElement('div'); c.className = 'optChip'; c.textContent = t;
      c.addEventListener('click', function(){
        wiz.play.type = t;
        wiz.play.phase = t === 'Run' ? 'runDetail' : t === 'Pass' ? 'passDetail' : t === 'Penalty' ? 'penaltyDetail' : t === 'Turnover' ? 'turnoverDetail' : 'puntDetail';
        renderWizard();
      });
      row.appendChild(c);
    });
    card.appendChild(row);
    if (onOffense) backBtn(card, wiz.play.coachCall !== undefined || wiz.play.calledSkipped ? 'calledPlay' : 'callCheck');
  }

  function renderPhaseRunDetail(card){
    const onOffense = wiz.game.possession === 'Us';
    card.innerHTML = '<h2>🏃 Run</h2>';
    if (onOffense){
      chipGroupField(card, 'Formation', wiz.play, 'formation', FORMATIONS);
      if (wiz.play.formation) chipGroupField(card, 'Formation Direction', wiz.play, 'formationDir', ['Left','Right']);
      chipGroupField(card, 'Play', wiz.play, 'playCall', PLAYBOOK);
      if (wiz.play.playCall) chipGroupField(card, 'Play Direction', wiz.play, 'playCallDir', ['Left','Right']);
      const tagsWrap = document.createElement('div'); tagsWrap.innerHTML = '<div class="fieldLabel">Add-ons (optional)</div>';
      const tagsRow = document.createElement('div'); tagsRow.className = 'chipRow';
      PLAY_TAGS.forEach(function(t){
        const c = document.createElement('div'); c.className = 'optChip' + ((wiz.play.tags||[]).indexOf(t) !== -1 ? ' active' : '');
        c.textContent = t;
        c.addEventListener('click', function(){
          const arr = wiz.play.tags || (wiz.play.tags = []);
          const i = arr.indexOf(t); if (i === -1) arr.push(t); else arr.splice(i,1);
          renderWizard();
        });
        tagsRow.appendChild(c);
      });
      tagsWrap.appendChild(tagsRow); card.appendChild(tagsWrap);
      renderPlayerChooser(card, 'Ball Carrier', wiz.play, 'carrier');
      chipGroupField(card, 'Direction', wiz.play, 'dir', ['Left','Middle','Right']);
    } else {
      // Nathan (follow-up): "When I chose run, it no longer gave me the
      // option of right middle or left like it should." Direction is
      // which way the run actually went -- a fact about the play, not a
      // "call" the way formation/playCall are, so unlike those it belongs
      // on defense too. It lived only in the onOffense branch above;
      // added here as well rather than moved, since offense still needs
      // its own copy alongside the ball carrier field there.
      renderPlayerChooser(card, 'Opponent Ball Carrier', wiz.play, 'oppCarrier', {optional:true});
      chipGroupField(card, 'Direction', wiz.play, 'dir', ['Left','Middle','Right']);
    }
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = 'Continue →';
    next.addEventListener('click', function(){ wiz.play.phase = 'resultSpot'; renderWizard(); });
    card.appendChild(next);
    backBtn(card, 'playType');
  }

  function renderPhasePassDetail(card){
    const onOffense = wiz.game.possession === 'Us';
    card.innerHTML = '<h2>🎯 Pass</h2>';
    if (onOffense){
      chipGroupField(card, 'Formation', wiz.play, 'formation', FORMATIONS);
      if (wiz.play.formation) chipGroupField(card, 'Formation Direction', wiz.play, 'formationDir', ['Left','Right']);
      chipGroupField(card, 'Play', wiz.play, 'playCall', PLAYBOOK);
      if (wiz.play.playCall) chipGroupField(card, 'Play Direction', wiz.play, 'playCallDir', ['Left','Right']);
      renderPlayerChooser(card, 'Passer', wiz.play, 'passer');
      renderPlayerChooser(card, 'Target', wiz.play, 'target');
    } else {
      renderPlayerChooser(card, 'Opponent Passer', wiz.play, 'oppPasser', {optional:true});
      wiz.play.oppTarget = wiz.play.oppTarget || '';
    }
    chipGroupField(card, 'Result', wiz.play, 'result', ['Complete','Incomplete']);
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = 'Continue →';
    next.addEventListener('click', function(){
      if (!wiz.play.result){ alert('Pick Complete or Incomplete first.'); return; }
      if (wiz.play.result === 'Incomplete'){ commitCurrentPlay(); return; } // Nathan: "if incomplete, ball stays in the same spot as previous play" -- nothing left to ask
      wiz.play.phase = 'resultSpot';
      renderWizard();
    });
    card.appendChild(next);
    backBtn(card, 'playType');
  }

  // Nathan: "It needs to understand basic football knowledge... if a
  // penalty is on the play, such as Holding, i need to be able to know if
  // it was called on the offense or defense but based on the down and
  // distance, the program needs to know that holding is 10 yards and
  // would result in a 1st down if on the defense, or a 2nd and 13 for the
  // offense." Down/distance math for a penalty was already correct (see
  // commitCurrentPlay's Penalty branch -- distance moves by the yardage,
  // down never burns), but nothing suggested the RIGHT yardage or knew
  // which penalty types are automatic first downs on defense in the first
  // place, leaving that entirely on the coach to remember mid-game. This
  // is a reasonable default ruleset, not a rulebook -- always still a
  // suggestion the coach can override (see the toggle it sets below),
  // since exact yardages and what's an automatic first down both vary by
  // level/league.
  const PENALTY_RULES = {
    'Holding': { yards: 10, autoFirstDownOnDefense: true },
    'False Start': { yards: 5, autoFirstDownOnDefense: false },
    'Offsides': { yards: 5, autoFirstDownOnDefense: false },
    'Delay of Game': { yards: 5, autoFirstDownOnDefense: false },
    'Pass Interference': { yards: 15, autoFirstDownOnDefense: true },
    'Facemask': { yards: 15, autoFirstDownOnDefense: true },
    'Unsportsmanlike Conduct': { yards: 15, autoFirstDownOnDefense: true },
    'Illegal Block': { yards: 10, autoFirstDownOnDefense: false },
  };
  function applyPenaltyAutoFirstDown(){
    const rule = PENALTY_RULES[wiz.play.penType];
    if (!rule || !wiz.play.penTeam) return;
    const penalizedIsOffense = (wiz.play.penTeam === 'Us') === (wiz.game.possession === 'Us');
    wiz.play.firstDown = !penalizedIsOffense && rule.autoFirstDownOnDefense;
  }
  function renderPhasePenaltyDetail(card){
    card.innerHTML = '<h2>🚩 Penalty</h2>';
    chipGroupField(card, 'Penalty On', wiz.play, 'penTeam', ['Us','Opponent'], function(v){ wiz.play.penTeam = v; applyPenaltyAutoFirstDown(); renderWizard(); });
    chipGroupField(card, 'Penalty', wiz.play, 'penType', ['Holding','False Start','Offsides','Delay of Game','Pass Interference','Facemask','Unsportsmanlike Conduct','Illegal Block','Other'], function(v){
      wiz.play.penType = v;
      const rule = PENALTY_RULES[v];
      if (rule) wiz.play.penYards = rule.yards;
      applyPenaltyAutoFirstDown();
      renderWizard();
    });
    const yardsWrap = document.createElement('div'); yardsWrap.innerHTML = '<div class="fieldLabel">Yards</div>';
    if (wiz.play.penYards == null) wiz.play.penYards = 5;
    const yr = document.createElement('div'); yr.className = 'yardRow';
    const minus = document.createElement('div'); minus.className = 'stepBtn'; minus.textContent = '−';
    const input = document.createElement('input'); input.type = 'number'; input.value = wiz.play.penYards;
    const plus = document.createElement('div'); plus.className = 'stepBtn'; plus.textContent = '+';
    minus.addEventListener('click', function(){ wiz.play.penYards = Math.max(0, wiz.play.penYards-1); renderWizard(); });
    plus.addEventListener('click', function(){ wiz.play.penYards = wiz.play.penYards+1; renderWizard(); });
    input.addEventListener('change', function(){ wiz.play.penYards = Math.max(0, Number(input.value||0)); });
    yr.appendChild(minus); yr.appendChild(input); yr.appendChild(plus);
    yardsWrap.appendChild(yr); card.appendChild(yardsWrap);
    const toggleRow = document.createElement('div'); toggleRow.className = 'chipRow'; toggleRow.style.marginTop = '10px';
    [['declined','Declined'], ['firstDown','Automatic 1st Down']].forEach(function(pair){
      const c = document.createElement('div'); c.className = 'optChip' + (wiz.play[pair[0]] ? ' active' : '');
      c.textContent = pair[1];
      c.addEventListener('click', function(){ wiz.play[pair[0]] = !wiz.play[pair[0]]; renderWizard(); });
      toggleRow.appendChild(c);
    });
    card.appendChild(toggleRow);
    if (wiz.play.penType && wiz.play.penTeam && PENALTY_RULES[wiz.play.penType]){
      const hint = document.createElement('div'); hint.className = 'sub'; hint.style.marginTop = '6px';
      hint.textContent = '💡 ' + wiz.play.penYards + ' yds pre-filled for ' + wiz.play.penType + (wiz.play.firstDown ? ' -- usually an automatic 1st down on defense' : '') + '. Adjust either if this call is different.';
      card.appendChild(hint);
    }
    wiz.play.spotSide = wiz.play.spotSide || sideYardFromAbs(wiz.game.spot).side;
    wiz.play.spotYard = wiz.play.spotYard != null ? wiz.play.spotYard : sideYardFromAbs(wiz.game.spot).yard;
    const spotDisplay = document.createElement('div');
    spotDisplay.innerHTML = '<div class="fieldLabel">Spot</div><div style="color:var(--dim);font-size:14px;">' + spotLabelAbs(wiz.game.spot) + ' (current line of scrimmage)</div>';
    card.appendChild(spotDisplay);
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Penalty & Continue';
    next.addEventListener('click', function(){ if (!wiz.play.penTeam || !wiz.play.penType){ alert('Pick who it\'s on and the penalty type.'); return; } commitCurrentPlay(); });
    card.appendChild(next);
    backBtn(card, 'playType');
  }

  function renderPhaseTurnoverDetail(card){
    card.innerHTML = '<h2>🔄 Turnover</h2>';
    chipGroupField(card, 'Type', wiz.play, 'toType', ['Fumble','Interception']);
    renderPlayerChooser(card, 'Lost By (offense)', wiz.play, 'lostBy', {optional:true});
    renderPlayerChooser(card, 'Recovered By (defense)', wiz.play, 'recoveredBy', {optional: true});
    // Nathan: "Marked an interception but it didn't say where he caught it
    // and where he was tackled. I put it at the 16 but it showed us with
    // 1st and 10 at the 27 which was the previous spot." Two real, related
    // bugs here: there was only ONE spot field for a turnover at all (an
    // interception return covers two different spots -- where it was
    // caught, and where the return ended, same as a punt already models
    // with catchSide/endSide), AND that one field was saved as
    // spotSide/spotYard while the spot-advance logic below reads
    // endSide/endYard -- a name mismatch, so whatever was actually entered
    // was saved onto the play but silently never used to move the ball.
    wiz.play.catchSide = wiz.play.catchSide || sideYardFromAbs(wiz.game.spot).side;
    wiz.play.catchYard = wiz.play.catchYard != null ? wiz.play.catchYard : sideYardFromAbs(wiz.game.spot).yard;
    card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Intercepted / Recovered At'; return l; })());
    card.appendChild(spotPicker(wiz.play, 'catchSide', 'catchYard', wiz.play.catchYard, renderWizard));
    wiz.play.endSide = wiz.play.endSide != null ? wiz.play.endSide : wiz.play.catchSide;
    wiz.play.endYard = wiz.play.endYard != null ? wiz.play.endYard : wiz.play.catchYard;
    card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Final Spot (after any return -- same as above if no return)'; return l; })());
    card.appendChild(spotPicker(wiz.play, 'endSide', 'endYard', wiz.play.endYard, renderWizard));
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Turnover & Continue';
    next.addEventListener('click', function(){ if (!wiz.play.toType){ alert('Pick Fumble or Interception.'); return; } commitCurrentPlay(); });
    card.appendChild(next);
    backBtn(card, 'playType');
  }

  function renderPhasePuntDetail(card){
    const isUs = wiz.game.possession === 'Us';
    card.innerHTML = '<h2>🦵 Punt</h2><div class="sub">4th down -- ' + (isUs ? 'we\'re' : 'they\'re') + ' punting it away.</div>';
    if (isUs) renderPlayerChooser(card, 'Punter', wiz.play, 'punter');
    else renderPlayerChooser(card, 'Opponent Punter', wiz.play, 'oppPunter', {optional:true});
    chipGroupField(card, 'Result', wiz.play, 'puntResult', ['Downed','Fair Catch','Touchback','Out of Bounds','Muffed','Returned']);
    if (wiz.play.puntResult === 'Returned'){
      if (isUs) renderPlayerChooser(card, 'Returned By (opponent, optional)', wiz.play, 'oppReturner', {optional:true});
      else renderPlayerChooser(card, 'Returned By', wiz.play, 'returner');
    }
    wiz.play.startSide = wiz.play.startSide || sideYardFromAbs(wiz.game.spot).side;
    wiz.play.startYard = wiz.play.startYard != null ? wiz.play.startYard : sideYardFromAbs(wiz.game.spot).yard;
    card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Punted From (spot)'; const r=document.createElement('div'); r.style.cssText='color:var(--dim);font-size:14px;'; r.textContent=spotLabelAbs(wiz.game.spot); const w=document.createElement('div'); w.appendChild(l); w.appendChild(r); return w; })());
    if (wiz.play.puntResult === 'Returned'){
      wiz.play.catchSide = wiz.play.catchSide || sideYardFromAbs(wiz.game.spot).side;
      wiz.play.catchYard = wiz.play.catchYard != null ? wiz.play.catchYard : Math.max(0, sideYardFromAbs(wiz.game.spot).yard - 25);
      card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Caught At'; return l; })());
      card.appendChild(spotPicker(wiz.play, 'catchSide', 'catchYard', wiz.play.catchYard, renderWizard));
    }
    wiz.play.endSide = wiz.play.endSide || sideYardFromAbs(wiz.game.spot).side;
    wiz.play.endYard = wiz.play.endYard != null ? wiz.play.endYard : Math.max(0, sideYardFromAbs(wiz.game.spot).yard - (wiz.play.puntResult === 'Returned' ? 20 : 30));
    card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Final Spot'; return l; })());
    card.appendChild(spotPicker(wiz.play, 'endSide', 'endYard', wiz.play.endYard, renderWizard));
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Punt & Continue';
    next.addEventListener('click', function(){ if (!wiz.play.puntResult){ alert('Pick how it ended.'); return; } commitCurrentPlay(); });
    card.appendChild(next);
    backBtn(card, 'playType');
  }

  // Nathan: "you choose the result, tackled, out of bounds, etc. You
  // choose the spot of the ball at the end of the play." One combined
  // screen for Run and completed Pass -- both need the same two things.
  function renderPhaseResultSpot(card){
    card.innerHTML = '<h2>📍 Where It Ended</h2>';
    wiz.play.endSide = wiz.play.endSide || sideYardFromAbs(wiz.game.spot).side;
    wiz.play.endYard = wiz.play.endYard != null ? wiz.play.endYard : sideYardFromAbs(wiz.game.spot).yard;
    card.appendChild(spotPicker(wiz.play, 'endSide', 'endYard', wiz.play.endYard, renderWizard));
    chipGroupField(card, 'How did it end?', wiz.play, 'resultKind', ['Tackled','Out of Bounds','Touchdown']);
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Play & Continue';
    next.addEventListener('click', function(){
      if (!wiz.play.resultKind){ alert('Pick how the play ended.'); return; }
      wiz.play.td = wiz.play.resultKind === 'Touchdown';
      wiz.play.oob = wiz.play.resultKind === 'Out of Bounds';
      // Nathan: "if tackle is chosen, pick the tackler" -- only meaningful
      // on DEFENSE (we only track OUR players' tackle credit; there's no
      // tackler to name when it's our own guy getting tackled).
      if (wiz.play.resultKind === 'Tackled' && wiz.game.possession === 'Opponent'){
        wiz.play.phase = 'tackler';
        renderWizard();
        return;
      }
      commitCurrentPlay();
    });
    card.appendChild(next);
    backBtn(card, wiz.play.type === 'Run' ? 'runDetail' : 'passDetail');
  }

  function renderPhaseTackler(card){
    card.innerHTML = '<h2>🛡️ Who Made the Tackle?</h2><div class="sub">Solo tackler first -- add anyone else who assisted after.</div>';
    renderPlayerChooser(card, 'Tackler (solo)', wiz.play, 'tackler');
    renderPlayerChooser(card, 'Assist (optional, select all who helped)', wiz.play, 'assist', {multi:true, optional:true});
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Tackle & Continue';
    next.addEventListener('click', function(){ commitCurrentPlay(); });
    card.appendChild(next);
    backBtn(card, 'resultSpot');
  }

  function renderPhaseFirstDownToast(card){
    card.innerHTML = '<div class="handoffIcon">🎉</div><h2 style="text-align:center;">First down!</h2>' +
      '<div class="sub" style="text-align:center;">' + (wiz.game.possession === 'Us' ? 'We' : 'They') + ' moved the chains -- next play is 1st &amp; ' + wiz.game.distance + '.</div>';
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = 'Next Play →';
    next.addEventListener('click', startNextPlay);
    card.appendChild(next);
  }

  // Nathan: "at this level - a kick is worth 2 points and a play for a
  // score is worth 1 point." The reverse of standard football (kick=1,
  // run/pass conversion=2) -- naming these "Kick"/"Play" instead of the
  // usual "PAT"/"2PT" on purpose, since those labels carry the standard
  // assumption and would be actively misleading for this league's actual
  // rule. Point values are hardcoded to this level's rule, not the chip
  // labels doing double duty as the number.
  function renderPhaseExtraPoint(card){
    const g = wiz.game;
    const scoringTeam = wiz.play.side === 'offense' ? 'Us' : 'Opponent'; // whoever just scored the TD attempts this, not necessarily still "on offense" by the time this renders
    card.innerHTML = '<div class="handoffIcon">🏆</div><h2 style="text-align:center;">Touchdown, ' + scoringTeam + '!</h2>' +
      '<div class="sub" style="text-align:center;">Extra point attempt -- at this level, a kick is worth 2, a run/pass play is worth 1.</div>';
    chipGroupField(card, 'Attempt', wiz.play, 'xpType', [['kick','🦵 Kick (2 pts)'],['play','🏃 Run/Pass Play (1 pt)']]);
    if (wiz.play.xpType) chipGroupField(card, 'Result', wiz.play, 'xpResult', ['Good','No Good']);
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log It & Continue';
    next.addEventListener('click', function(){
      if (!wiz.play.xpType || !wiz.play.xpResult){ alert('Pick the attempt type and the result.'); return; }
      commitExtraPoint(scoringTeam);
    });
    card.appendChild(next);
  }
  async function commitExtraPoint(scoringTeam){
    const g = wiz.game;
    const points = wiz.play.xpType === 'kick' ? 2 : 1;
    const good = wiz.play.xpResult === 'Good';
    if (good){ if (scoringTeam === 'Us') g.scoreUs += points; else g.scoreOpp += points; }
    const entry = {
      id: genId(), type:'score', side: wiz.play.side, quarter: g.quarter,
      scoreKind: (wiz.play.xpType === 'kick' ? 'Kick' : 'Run/Pass Play') + ' (' + (good ? points + ' pt Good' : 'No Good') + ')',
      scoreTeam: scoringTeam,
    };
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      plays.push(entry);
      const gameState = { plays: plays, quarter: g.quarter, spot: g.spot, down: g.down, distance: g.distance,
        finalUs: g.scoreUs, finalOpp: g.scoreOpp, updatedAt: new Date().toISOString() };
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; return; }
    loadStatus.textContent = '';
    // Nathan: a touchdown+extra point is always followed by a real
    // kickoff -- reuses the same idea as the opening kickoff (a real
    // 'kick' play, possession flips, down/distance resets to 1st & 10)
    // rather than handing off to Stat Keeper for it, same as the extra
    // point itself no longer does.
    wiz.play = { phase: 'postScoreKickoff', kickingTeam: scoringTeam };
    renderWizard();
  }

  function renderPhasePostScoreKickoff(card){
    const g = wiz.game;
    const isUsKick = wiz.play.kickingTeam === 'Us';
    card.innerHTML = '<h2>🏈 ' + escapeHtml(wiz.play.kickingTeam) + ' Kicks Off</h2><div class="sub">Same as the opening kickoff -- where it was caught, and where the return ended.</div>';
    chipGroupField(card, 'Onside Attempt?', wiz.play, 'onside', [[true,'Yes'],[false,'No']]);
    if (wiz.play.onside){
      chipGroupField(card, 'Recovered By', wiz.play, 'recoveredByTeam', ['Us','Opponent']);
    } else {
      if (isUsKick) renderPlayerChooser(card, 'Returner (opponent, optional)', wiz.play, 'oppReturner', {optional:true});
      else renderPlayerChooser(card, 'Returner', wiz.play, 'returner');
      wiz.play.catchSide = wiz.play.catchSide != null ? wiz.play.catchSide : (isUsKick ? 'OPP' : 'OWN');
      wiz.play.catchYard = wiz.play.catchYard != null ? wiz.play.catchYard : 15;
      card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Caught At'; return l; })());
      card.appendChild(spotPicker(wiz.play, 'catchSide', 'catchYard', wiz.play.catchYard, renderWizard));
      wiz.play.endSide = wiz.play.endSide != null ? wiz.play.endSide : wiz.play.catchSide;
      wiz.play.endYard = wiz.play.endYard != null ? wiz.play.endYard : wiz.play.catchYard;
      card.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent='Brought Ball To'; return l; })());
      card.appendChild(spotPicker(wiz.play, 'endSide', 'endYard', wiz.play.endYard, renderWizard));
    }
    const next = document.createElement('button'); next.className = 'primaryBtn'; next.textContent = '✅ Log Kickoff & Continue';
    next.addEventListener('click', function(){ commitPostScoreKickoff(); });
    card.appendChild(next);
  }
  async function commitPostScoreKickoff(){
    const g = wiz.game;
    const isUsKick = wiz.play.kickingTeam === 'Us';
    const entry = { id: genId(), type:'kick', side: isUsKick ? 'offense' : 'defense', quarter: g.quarter,
      kickTeam: wiz.play.kickingTeam, onside: !!wiz.play.onside };
    let newSpot = 50, newPossession = isUsKick ? 'Opponent' : 'Us';
    if (wiz.play.onside){
      entry.recoveredByTeam = wiz.play.recoveredByTeam;
      newPossession = wiz.play.recoveredByTeam;
      newSpot = g.spot; // onside kicks don't carry their own spot math -- same simplification stat-keeper.html already makes
    } else {
      entry.startSide = isUsKick ? 'OWN' : 'OPP'; entry.startYard = 40;
      entry.catchSide = wiz.play.catchSide; entry.catchYard = wiz.play.catchYard;
      entry.endSide = wiz.play.endSide; entry.endYard = wiz.play.endYard;
      entry.returner = wiz.play.returner; entry.oppReturner = wiz.play.oppReturner;
      const endAbs = absoluteSpotOf(wiz.play.endSide, wiz.play.endYard);
      if (endAbs != null) newSpot = clampSpot(endAbs);
    }
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      plays.push(entry);
      g.spot = newSpot; g.down = 1; g.distance = 10; g.possession = newPossession;
      const gameState = { plays: plays, quarter: g.quarter, spot: g.spot, down: g.down, distance: g.distance,
        finalUs: g.scoreUs, finalOpp: g.scoreOpp, updatedAt: new Date().toISOString() };
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; return; }
    loadStatus.textContent = '';
    startNextPlay();
  }

  function startNextPlay(){
    wiz.play = { phase: (wiz.game.possession === 'Us' && !filmReviewMode) ? 'callCheck' : 'playType' };
    renderWizard();
  }

  // Nathan: "we need a way of Logging a timeout to a team as an event...
  // Same for end of quarters."
  // Nathan: "give me the option to Save the Current Stat Keeper for that
  // game as a work in progress." Stamps statsStatus directly onto the
  // same statKeeperLogs/{gameId} record everything else already lives on
  // -- a simple status flag, not a different save mechanism, since every
  // play is already persisted the moment it's logged regardless.
  async function saveAsWorkInProgress(){
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const gameState = Object.assign({}, existing, { statsStatus: 'in-progress', updatedAt: new Date().toISOString() });
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
      loadStatus.textContent = '✅ Saved as work in progress';
      setTimeout(function(){ if (loadStatus.textContent === '✅ Saved as work in progress') loadStatus.textContent = ''; }, 2500);
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; }
  }

  async function logEvent(kind){
    if (kind === 'timeout'){
      const team = confirm('Timeout by US? (Cancel = Opponent)') ? 'Us' : 'Opponent';
      await pushPlayEntry({ type:'timeout', id: genId(), side: team === 'Us' ? 'offense' : 'defense', quarter: wiz.game.quarter, team: team });
    } else {
      const nextQ = wiz.game.quarter + 1;
      await pushPlayEntry({ type:'quarterEnd', id: genId(), quarter: wiz.game.quarter });
      wiz.game.quarter = nextQ;
      // Nathan: "end of 2nd and 3rd quarters? It will automatically flip
      // the field and retain down, distance and possession." Teams switch
      // ends every quarter in real football, not just at halftime -- so
      // this flips every time, uniformly, while everything else
      // (spot/down/distance/possession) is simply never touched here at
      // all, which is what "retain" actually means in this data: there's
      // nothing to reset because a quarter change was never wired to
      // reset it in the first place.
      wiz.game.defendingEnd = wiz.game.defendingEnd === 'Left' ? 'Right' : 'Left';
    }
    renderWizard();
  }

  async function pushPlayEntry(entry){
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      plays.push(entry); // oldest-last-in-array-order for pushed entries, same convention commitKickoff established
      const gameState = {
        plays: plays, quarter: wiz.game.quarter, spot: wiz.game.spot, down: wiz.game.down, distance: wiz.game.distance,
        finalUs: (existing && existing.finalUs) || '', finalOpp: (existing && existing.finalOpp) || '',
        updatedAt: new Date().toISOString(),
      };
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
      loadStatus.textContent = '';
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; }
  }

  // Nathan: "If a play results in a first down, that should be recognized
  // and the following play with be a first down." Builds the actual entry
  // object(s) for whatever's in wiz.play, saves them, advances
  // spot/down/distance/possession/score, then either shows the first-down
  // toast or jumps straight into the next play.
  async function commitCurrentPlay(){
    const g = wiz.game;
    const onOffense = g.possession === 'Us';
    const wasFourthDown = g.down === 4;
    const entries = [];
    let type = wiz.play.type;
    // Nathan: "Give me the options of setting markers at the end of each
    // play so there is a link between the plays and the clip." Captured
    // right here, at the exact moment a play is committed -- no separate
    // button to remember, and it's on `base` so every entry type below
    // (Run, Pass, Penalty, Turnover, Punt) gets it the same way. null on
    // anything that isn't a YouTube video (Drive/Hudl links, or no film at
    // all) rather than a fake/misleading number.
    const base = { id: genId(), side: onOffense ? 'offense' : 'defense', quarter: g.quarter, filmTimestamp: getCurrentFilmTime() };
    let startAbs = g.spot, endAbs = g.spot;
    let converted = false;
    let possessionFlips = false;

    if (type === 'Run'){
      const sy = sideYardFromAbs(g.spot);
      startAbs = g.spot; endAbs = absoluteSpotOf(wiz.play.endSide, wiz.play.endYard);
      const yards = signedYardsFromSpots(startAbs, endAbs, onOffense);
      converted = yards >= g.distance;
      // Nathan: "Within the Wizard, it logged the offensive play and the
      // tackle as two separate plays." That second, linked 'tackle' entry
      // also had its own start/end spot fields, computed separately from
      // the run's own -- which is exactly how it ended up showing a
      // nonsense "-23 yds" tackle in the log. tackler/assist now live
      // directly ON this same entry instead (matching the identical fix
      // already made in stat-keeper.html), so there's only ever one entry
      // per play, and nothing to get out of sync with the run itself.
      entries.push(Object.assign({}, base, {
        type:'run', runTeam: onOffense ? 'Us' : 'Opponent',
        carrier: wiz.play.carrier, oppCarrier: wiz.play.oppCarrier,
        startSide: sy.side, startYard: sy.yard, endSide: wiz.play.endSide, endYard: wiz.play.endYard,
        yards: yards, dir: wiz.play.dir, formation: wiz.play.formation, formationDir: wiz.play.formationDir,
        playCall: wiz.play.playCall, playCallDir: wiz.play.playCallDir,
        coachFormation: wiz.play.coachFormation, coachFormationDir: wiz.play.coachFormationDir,
        coachCall: wiz.play.coachCall, coachCallDir: wiz.play.coachCallDir,
        firstDown: converted, td: !!wiz.play.td, oob: wiz.play.resultKind === 'Out of Bounds', down: g.down, distance: g.distance,
        tackler: (!onOffense && wiz.play.resultKind === 'Tackled') ? wiz.play.tackler : undefined,
        assist: (!onOffense && wiz.play.resultKind === 'Tackled') ? (wiz.play.assist || []) : undefined,
      }));
    } else if (type === 'Pass'){
      if (wiz.play.result === 'Incomplete'){
        const sy = sideYardFromAbs(g.spot);
        entries.push(Object.assign({}, base, {
          type:'pass', passTeam: onOffense ? 'Us' : 'Opponent', result:'Incomplete',
          passer: wiz.play.passer, target: wiz.play.target, oppPasser: wiz.play.oppPasser, oppTarget: wiz.play.oppTarget,
          spotSide: sy.side, spotYard: sy.yard,
          formation: wiz.play.formation, formationDir: wiz.play.formationDir, playCall: wiz.play.playCall, playCallDir: wiz.play.playCallDir,
          coachFormation: wiz.play.coachFormation, coachFormationDir: wiz.play.coachFormationDir, coachCall: wiz.play.coachCall, coachCallDir: wiz.play.coachCallDir,
          down: g.down, distance: g.distance,
        }));
      } else {
        const sy = sideYardFromAbs(g.spot);
        startAbs = g.spot; endAbs = absoluteSpotOf(wiz.play.endSide, wiz.play.endYard);
        const yards = signedYardsFromSpots(startAbs, endAbs, onOffense);
        converted = yards >= g.distance;
        entries.push(Object.assign({}, base, {
          type:'pass', passTeam: onOffense ? 'Us' : 'Opponent', result:'Complete',
          passer: wiz.play.passer, target: wiz.play.target, oppPasser: wiz.play.oppPasser, oppTarget: wiz.play.oppTarget,
          startSide: sy.side, startYard: sy.yard, endSide: wiz.play.endSide, endYard: wiz.play.endYard, yards: yards,
          formation: wiz.play.formation, formationDir: wiz.play.formationDir, playCall: wiz.play.playCall, playCallDir: wiz.play.playCallDir,
          coachFormation: wiz.play.coachFormation, coachFormationDir: wiz.play.coachFormationDir, coachCall: wiz.play.coachCall, coachCallDir: wiz.play.coachCallDir,
          firstDown: converted, td: !!wiz.play.td, oob: wiz.play.resultKind === 'Out of Bounds', down: g.down, distance: g.distance,
          tackler: (!onOffense && wiz.play.resultKind === 'Tackled') ? wiz.play.tackler : undefined,
          assist: (!onOffense && wiz.play.resultKind === 'Tackled') ? (wiz.play.assist || []) : undefined,
        }));
      }
    } else if (type === 'Penalty'){
      entries.push(Object.assign({}, base, { type:'penalty', penTeam: wiz.play.penTeam, penType: wiz.play.penType, penOther: wiz.play.penOther,
        penYards: wiz.play.penYards, declined: !!wiz.play.declined, firstDown: !!wiz.play.firstDown,
        spotSide: wiz.play.spotSide, spotYard: wiz.play.spotYard, penPlayer: wiz.play.penPlayer }));
      converted = !!wiz.play.firstDown;
    } else if (type === 'Turnover'){
      entries.push(Object.assign({}, base, { type:'turnover', toType: wiz.play.toType, lostBy: wiz.play.lostBy, recoveredBy: wiz.play.recoveredBy,
        catchSide: wiz.play.catchSide, catchYard: wiz.play.catchYard, endSide: wiz.play.endSide, endYard: wiz.play.endYard }));
      possessionFlips = true;
    } else if (type === 'Punt'){
      const sy = sideYardFromAbs(g.spot);
      entries.push(Object.assign({}, base, { type:'punt', puntTeam: onOffense ? 'Us' : 'Opponent', puntResult: wiz.play.puntResult,
        punter: wiz.play.punter, oppPunter: wiz.play.oppPunter, returner: wiz.play.returner, oppReturner: wiz.play.oppReturner,
        startSide: sy.side, startYard: sy.yard, catchSide: wiz.play.catchSide, catchYard: wiz.play.catchYard,
        endSide: wiz.play.endSide, endYard: wiz.play.endYard }));
      possessionFlips = true;
    }

    // Save all entries from this play in one round-trip.
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      entries.forEach(function(e){ plays.push(e); });

      // ---- advance spot ----
      if (type === 'Run' || (type === 'Pass' && wiz.play.result === 'Complete')){
        g.spot = clampSpot(endAbs);
      } else if (type === 'Punt' || type === 'Turnover'){
        const endA = absoluteSpotOf(wiz.play.endSide, wiz.play.endYard);
        if (endA != null) g.spot = clampSpot(endA);
      } else if (type === 'Penalty' && !wiz.play.declined){
        const yds = Number(wiz.play.penYards||0);
        g.spot = clampSpot(g.spot + (wiz.play.penTeam === 'Us' ? -yds : yds));
      }

      // ---- advance down/distance ----
      if (type === 'Run' || (type === 'Pass' && wiz.play.result === 'Complete')){
        if (converted){ g.down = 1; g.distance = Math.max(1, Math.min(10, onOffense ? (100-g.spot) : g.spot)); }
        else { g.down = g.down + 1; g.distance = Math.max(1, g.distance - signedYardsFromSpots(startAbs, endAbs, onOffense)); }
      } else if (type === 'Pass' && wiz.play.result === 'Incomplete'){
        g.down = g.down + 1;
      } else if (type === 'Penalty' && !wiz.play.declined){
        // Nathan: "If a 1st down is set and then a penalty happens, it
        // needs to update that on the down and distance." A penalty was
        // already correctly moving the SPOT (see the block just above),
        // but distance itself was never touched unless "Automatic 1st
        // Down" was checked -- a plain 5-yard false start on 1st & 10
        // should become 1st & 15, not silently stay 1st & 10. Down number
        // itself is untouched either way (a penalty never burns a down by
        // rule) unless the yardage happens to reach the line to gain on
        // its own, which -- same as a real penalty -- is a first down
        // whether or not "Automatic 1st Down" was checked.
        const yds = Number(wiz.play.penYards||0);
        const penalizedIsOffense = (wiz.play.penTeam === 'Us') === onOffense;
        if (converted){
          g.down = 1; g.distance = Math.max(1, Math.min(10, onOffense ? (100-g.spot) : g.spot));
        } else if (penalizedIsOffense){
          g.distance = g.distance + yds;
        } else {
          const newDist = g.distance - yds;
          if (newDist <= 0){ converted = true; g.down = 1; g.distance = Math.max(1, Math.min(10, onOffense ? (100-g.spot) : g.spot)); }
          else { g.distance = newDist; }
        }
      }

      // ---- possession changes ----
      if (possessionFlips || (wasFourthDown && (type === 'Run' || type === 'Pass') && !converted && g.down > 4)){
        g.possession = g.possession === 'Us' ? 'Opponent' : 'Us';
        g.down = 1; g.distance = 10;
      }

      const gameState = { plays: plays, quarter: g.quarter, spot: g.spot, down: g.down, distance: g.distance,
        finalUs: g.scoreUs, finalOpp: g.scoreOpp, updatedAt: new Date().toISOString() };
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; return; }
    loadStatus.textContent = '';

    // Nathan: "when a run is called and its a touchdown - I need to be
    // able to set if the PAT is good." The score bug never actually
    // tracked points at all before this -- scoreUs/scoreOpp sat wherever
    // they were initialized and finalUs/finalOpp only ever got set by
    // hand elsewhere (Stat Keeper's own Final Score Check). A touchdown
    // is worth 6 regardless of who scored it (offense, or a defensive/
    // special-teams TD), credited to whichever team just had the ball.
    if (entries.some(function(e){ return e.td; })){
      if (onOffense) g.scoreUs += 6; else g.scoreOpp += 6;
      // wiz.play still holds the just-committed run/pass's fields (formation,
      // carrier, etc.) -- side was never one of them (it lives on the entry's
      // `base` object, not the draft), so it's set explicitly here for
      // renderPhaseExtraPoint to read who actually scored.
      wiz.play.side = onOffense ? 'offense' : 'defense';
      wiz.play.phase = 'extraPoint';
      renderWizard();
      return;
    }
    if (converted){ wiz.play.phase = 'firstDownToast'; renderWizard(); return; }
    startNextPlay();
  }
  function absoluteSpotOf(side, yard){ return absoluteSpot(side, yard); }


  // ---- Audit Mode: review an already-logged game, play by play ----
  // Nathan: "The Game Wizard was done prior to plays being added, same for
  // starting ball spot and ending ball spot. With those put in place
  // afterwards, only some of the plays are effected by it... If the wizard
  // showed the info it has on the play (saying none if it wasn't included,
  // same for ball placements) then I should have an option to update for
  // that play. I would have to go through all the plays from the game to
  // ensure they are correct."
  //
  // Deliberately NOT the same phase-by-phase flow as building a brand new
  // play (renderPhaseRunDetail etc.) -- those are wired to
  // commitCurrentPlay(), which APPENDS a new play and re-advances the
  // running spot/down/distance/possession simulation. Reviewing an
  // existing play needs the opposite: show everything that play might
  // carry on ONE screen, editable right there, saved back into that exact
  // same array slot (matched by id) without touching anything else's
  // spot/score/possession math at all. A field-descriptor table drives one
  // generic renderer instead of ten near-duplicate per-type screens.
  const AUDIT_FIELDS = {
    run: [
      {key:'formation', label:'Formation', kind:'chip', options:FORMATIONS},
      {key:'formationDir', label:'Formation Direction', kind:'chip', options:['Left','Right']},

  let auditPlays = [];
  let auditIndex = 0;
  let auditDraft = {};

  function startAuditMode(gs){
    auditPlays = (gs.plays || []).filter(function(p){ return p.type !== 'quarterEnd' && p.type !== 'timeout'; }).slice().reverse();
    if (!auditPlays.length){ alert('No plays to review yet.'); return; }
    auditIndex = 0;
    loadAuditDraft();
    wiz.step = 'audit';
    renderWizard();
  }
  function loadAuditDraft(){ auditDraft = Object.assign({}, auditPlays[auditIndex]); }

  function auditFieldValueText(play, f){
    if (f.kind === 'spotPair'){
      const a = spotLabel(play.startSide, play.startYard), b = spotLabel(play.endSide, play.endYard);
      return (a && b) ? (a + ' → ' + b) : '— none —';
    }
    if (f.kind === 'catchEndPair'){
      const a = spotLabel(play.catchSide, play.catchYard), b = spotLabel(play.endSide, play.endYard);
      return (a && b) ? (a + ' → ' + b) : '— none —';
    }
    if (f.kind === 'spotSingle'){
      const a = spotLabel(play.spotSide, play.spotYard);
      return a || '— none —';
    }
    if (f.kind === 'spotTriple'){
      const a = spotLabel(play.startSide, play.startYard), c = spotLabel(play.catchSide, play.catchYard), b = spotLabel(play.endSide, play.endYard);
      if (!a && !c && !b) return '— none —';
      return (a||'?') + ' → ' + (c||'(no catch spot)') + ' → ' + (b||'?');
    }
    if (f.kind === 'downdist'){
      return (play.down != null && play.distance != null) ? (['1st','2nd','3rd','4th'][play.down-1] + ' & ' + play.distance) : '— none —';
    }
    if (f.kind === 'toggle') return play[f.key] ? 'Yes' : 'No';
    if (f.kind === 'playerMulti') return (play[f.key] && play[f.key].length) ? play[f.key].join(', ') : '— none —';
    return play[f.key] || '— none —';
  }

  function renderAuditFieldEditor(container, f){
    const wrap = document.createElement('div'); wrap.style.cssText = 'margin-bottom:4px;';
    if (f.kind === 'chip') chipGroupField(wrap, f.label, auditDraft, f.key, f.options);
    else if (f.kind === 'player') renderPlayerChooser(wrap, f.label, auditDraft, f.key, {optional: f.optional});
    else if (f.kind === 'playerMulti') renderPlayerChooser(wrap, f.label, auditDraft, f.key, {multi:true, optional:true});
    else if (f.kind === 'toggle'){
      chipGroupField(wrap, f.label, auditDraft, f.key, [[true,'Yes'],[false,'No']]);
    } else if (f.kind === 'number'){
      const lbl = document.createElement('div'); lbl.className = 'fieldLabel'; lbl.textContent = f.label;
      wrap.appendChild(lbl);
      const yr = document.createElement('div'); yr.className = 'yardRow';
      const minus = document.createElement('div'); minus.className = 'stepBtn'; minus.textContent = '−';
      const input = document.createElement('input'); input.type = 'number'; input.value = auditDraft[f.key] != null ? auditDraft[f.key] : 0;
      const plus = document.createElement('div'); plus.className = 'stepBtn'; plus.textContent = '+';
      minus.addEventListener('click', function(){ auditDraft[f.key] = Math.max(0, (Number(input.value)||0)-1); renderWizard(); });
      plus.addEventListener('click', function(){ auditDraft[f.key] = (Number(input.value)||0)+1; renderWizard(); });
      input.addEventListener('change', function(){ auditDraft[f.key] = Number(input.value)||0; });
      yr.appendChild(minus); yr.appendChild(input); yr.appendChild(plus);
      wrap.appendChild(yr);
    } else if (f.kind === 'spotPair'){
      if (auditDraft.startSide == null){ const sy = sideYardFromAbs(50); auditDraft.startSide = sy.side; auditDraft.startYard = sy.yard; }
      if (auditDraft.endSide == null){ const sy = sideYardFromAbs(50); auditDraft.endSide = sy.side; auditDraft.endYard = sy.yard; }
      const l1 = document.createElement('div'); l1.className = 'fieldLabel'; l1.textContent = 'Start Spot';
      wrap.appendChild(l1); wrap.appendChild(spotPicker(auditDraft, 'startSide', 'startYard', auditDraft.startYard, renderWizard));
      const l2 = document.createElement('div'); l2.className = 'fieldLabel'; l2.textContent = 'End Spot';
      wrap.appendChild(l2); wrap.appendChild(spotPicker(auditDraft, 'endSide', 'endYard', auditDraft.endYard, renderWizard));
    } else if (f.kind === 'catchEndPair'){
      // Nathan: "it didn't say where he caught it and where he was
      // tackled." Same shape as spotPair above, but catchSide/catchYard +
      // endSide/endYard -- the actual fields a Turnover entry carries
      // (there's no separate "start spot" stored on it; the interception/
      // recovery spot itself is the first of the two).
      if (auditDraft.catchSide == null){ const sy = sideYardFromAbs(50); auditDraft.catchSide = sy.side; auditDraft.catchYard = sy.yard; }
      if (auditDraft.endSide == null){ const sy = sideYardFromAbs(50); auditDraft.endSide = sy.side; auditDraft.endYard = sy.yard; }
      const l1 = document.createElement('div'); l1.className = 'fieldLabel'; l1.textContent = 'Intercepted / Recovered At';
      wrap.appendChild(l1); wrap.appendChild(spotPicker(auditDraft, 'catchSide', 'catchYard', auditDraft.catchYard, renderWizard));
      const l2 = document.createElement('div'); l2.className = 'fieldLabel'; l2.textContent = 'Final Spot (after any return)';
      wrap.appendChild(l2); wrap.appendChild(spotPicker(auditDraft, 'endSide', 'endYard', auditDraft.endYard, renderWizard));
    } else if (f.kind === 'spotSingle'){
      if (auditDraft.spotSide == null){ const sy = sideYardFromAbs(50); auditDraft.spotSide = sy.side; auditDraft.spotYard = sy.yard; }
      const l = document.createElement('div'); l.className = 'fieldLabel'; l.textContent = f.label;
      wrap.appendChild(l); wrap.appendChild(spotPicker(auditDraft, 'spotSide', 'spotYard', auditDraft.spotYard, renderWizard));
    } else if (f.kind === 'spotTriple'){
      if (auditDraft.startSide == null){ const sy = sideYardFromAbs(50); auditDraft.startSide = sy.side; auditDraft.startYard = sy.yard; }
      if (auditDraft.catchSide == null){ const sy = sideYardFromAbs(50); auditDraft.catchSide = sy.side; auditDraft.catchYard = sy.yard; }
      if (auditDraft.endSide == null){ const sy = sideYardFromAbs(50); auditDraft.endSide = sy.side; auditDraft.endYard = sy.yard; }
      const l1 = document.createElement('div'); l1.className = 'fieldLabel'; l1.textContent = 'Start Spot';
      wrap.appendChild(l1); wrap.appendChild(spotPicker(auditDraft, 'startSide', 'startYard', auditDraft.startYard, renderWizard));
      const l2 = document.createElement('div'); l2.className = 'fieldLabel'; l2.textContent = 'Caught At (leave as-is if there was no return)';
      wrap.appendChild(l2); wrap.appendChild(spotPicker(auditDraft, 'catchSide', 'catchYard', auditDraft.catchYard, renderWizard));
      const l3 = document.createElement('div'); l3.className = 'fieldLabel'; l3.textContent = 'Final Spot';
      wrap.appendChild(l3); wrap.appendChild(spotPicker(auditDraft, 'endSide', 'endYard', auditDraft.endYard, renderWizard));
    } else if (f.kind === 'downdist'){
      if (auditDraft.down == null) auditDraft.down = 1;
      if (auditDraft.distance == null) auditDraft.distance = 10;
      const dWrap = document.createElement('div');
      dWrap.appendChild((function(){ const l=document.createElement('div'); l.className='fieldLabel'; l.textContent=f.label; return l; })());
      const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
      row.appendChild(optChipsSimple(auditDraft, 'down', [[1,'1st'],[2,'2nd'],[3,'3rd'],[4,'4th']]));
      const yr = document.createElement('div'); yr.className = 'yardRow';
      const minus = document.createElement('div'); minus.className = 'stepBtn'; minus.textContent = '−';
      const input = document.createElement('input'); input.type = 'number'; input.value = auditDraft.distance;
      const plus = document.createElement('div'); plus.className = 'stepBtn'; plus.textContent = '+';
      minus.addEventListener('click', function(){ auditDraft.distance = Math.max(1, auditDraft.distance-1); renderWizard(); });
      plus.addEventListener('click', function(){ auditDraft.distance = auditDraft.distance+1; renderWizard(); });
      input.addEventListener('change', function(){ auditDraft.distance = Math.max(1, Number(input.value)||1); });
      yr.appendChild(minus); yr.appendChild(input); yr.appendChild(plus);
      row.appendChild(yr);
      dWrap.appendChild(row);
      wrap.appendChild(dWrap);
    }
    container.appendChild(wrap);
  }
  // Small chip helper for a plain [value,label] options list bound directly
  // to a draft object -- same idea as chipGroupField but usable for the
  // numeric `down` value (1-4) without it being confused for the string-
  // valued chip fields chipGroupField normally handles.
  function optChipsSimple(stateObj, key, options){
    const row = document.createElement('div'); row.className = 'chipRow'; row.style.margin = '0';
    options.forEach(function(pair){
      const c = document.createElement('div'); c.className = 'optChip' + (stateObj[key] === pair[0] ? ' active' : '');
      c.style.cssText = 'flex:0 0 auto;min-width:auto;padding:8px 12px;font-size:12px;';
      c.textContent = pair[1];
      c.addEventListener('click', function(){ stateObj[key] = pair[0]; renderWizard(); });
      row.appendChild(c);
    });
    return row;
  }

  function renderAuditStep(area){
    const play = auditPlays[auditIndex];
    const fields = AUDIT_FIELDS[play.type] || [];
    const missingCount = fields.filter(function(f){ return auditFieldValueText(play, f) === '— none —'; }).length;

    const progress = document.createElement('div');
    progress.style.cssText = 'text-align:center;font-size:11px;color:var(--dim2);margin-bottom:6px;';
    progress.textContent = 'Reviewing Play ' + (auditIndex+1) + ' of ' + auditPlays.length + (missingCount ? ' · ' + missingCount + ' field(s) blank' : ' · looks complete');
    area.appendChild(progress);

    const card = document.createElement('div'); card.className = 'card';
    const sideTag = play.side ? (play.side === 'offense' ? 'OFF' : 'DEF') : '';
    card.innerHTML = '<h2>' + (sideTag ? sideTag + ' · ' : '') + play.type.toUpperCase() + '</h2>' +
      '<div class="sub">Quarter ' + (play.quarter || '?') + ' -- ' + escapeHtml(describePlay(play)) + '</div>';

    const summary = document.createElement('div'); summary.style.cssText = 'margin:10px 0;padding:10px;background:#12161c;border-radius:8px;';
    fields.forEach(function(f){
      const val = auditFieldValueText(play, f);
      const row = document.createElement('div'); row.style.cssText = 'display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px;';
      row.innerHTML = '<span style="color:var(--dim2);">' + escapeHtml(f.label) + '</span><span style="color:' + (val === '— none —' ? '#e0402a' : '#fff') + ';font-weight:600;text-align:right;">' + escapeHtml(val) + '</span>';
      summary.appendChild(row);
    });
    card.appendChild(summary);

    const editHeader = document.createElement('div'); editHeader.className = 'fieldLabel'; editHeader.style.marginTop = '4px'; editHeader.textContent = 'Fill in / correct anything below, then save:';
    card.appendChild(editHeader);
    fields.forEach(function(f){ renderAuditFieldEditor(card, f); });

    const saveBtn = document.createElement('button'); saveBtn.className = 'primaryBtn'; saveBtn.textContent = '💾 Save & Next Play';
    saveBtn.addEventListener('click', function(){ saveAuditDraft(true); });
    card.appendChild(saveBtn);
    const skipBtn = document.createElement('button'); skipBtn.className = 'ghostBtn'; skipBtn.textContent = 'Skip (Already Correct) →';
    skipBtn.addEventListener('click', function(){ goToNextAuditPlay(); });
    card.appendChild(skipBtn);
    const navRow = document.createElement('div'); navRow.style.cssText = 'display:flex;gap:8px;';
    const prevBtn = document.createElement('button'); prevBtn.className = 'ghostBtn'; prevBtn.style.margin = '0'; prevBtn.textContent = '← Previous Play';
    prevBtn.disabled = auditIndex === 0;
    prevBtn.addEventListener('click', function(){ auditIndex = Math.max(0, auditIndex-1); loadAuditDraft(); renderWizard(); });
    const exitBtn = document.createElement('button'); exitBtn.className = 'ghostBtn'; exitBtn.style.margin = '0'; exitBtn.textContent = '▶️ Back to Live Plays';
    exitBtn.addEventListener('click', resumeLivePlayLoop);
    navRow.appendChild(prevBtn); navRow.appendChild(exitBtn);
    card.appendChild(navRow);
    area.appendChild(card);
  }

  function goToNextAuditPlay(){
    if (auditIndex >= auditPlays.length - 1){
      alert('That was the last play -- review complete!');
      resumeLivePlayLoop();
      return;
    }
    auditIndex += 1;
    loadAuditDraft();
    renderWizard();
  }

  async function saveAuditDraft(advance){
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      const idx = plays.findIndex(function(p){ return p.id === auditDraft.id; });
      if (idx !== -1) plays[idx] = Object.assign({}, plays[idx], auditDraft);
      const gameState = Object.assign({}, existing, { plays: plays, updatedAt: new Date().toISOString() });
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
      // Quick-edit (from the live loop) never populated auditPlays/auditIndex
      // for a real review sequence -- writing into them here would silently
      // clobber an unrelated slot if a full Audit Mode session happened
      // earlier in the tab. Skip that bookkeeping outright when not really
      // auditing; goToNextAuditPlay (below) is the only thing that ever
      // reads it back, and quick-edit never calls that.
      if (!quickEditMode) auditPlays[auditIndex] = auditDraft;
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; return; }
    loadStatus.textContent = '';
    if (advance) goToNextAuditPlay();
  }

  // Nathan: "I can't see the play log in the entry screen so I don't know
  // what was added is accurate" + "It's still way too clunky" for fixing a
  // mistake without leaving the live flow. Reuses the exact same
  // AUDIT_FIELDS/renderAuditFieldEditor/saveAuditDraft machinery Audit
  // Mode already has -- a "review one play" screen, not a second, parallel
  // editor to keep in sync with the real one.
  let quickEditMode = false;
  function openQuickEdit(play){
    auditDraft = Object.assign({}, play);
    quickEditMode = true;
    wiz.step = 'quickEdit';
    renderWizard();
  }
  function renderQuickEditStep(area){
    const fields = AUDIT_FIELDS[auditDraft.type] || [];
    const card = document.createElement('div'); card.className = 'card';
    const sideTag = auditDraft.side ? (auditDraft.side === 'offense' ? 'OFF' : 'DEF') : '';
    card.innerHTML = '<h2>✏️ Fix This Play</h2><div class="sub">' + (sideTag ? sideTag + ' · ' : '') + (auditDraft.type||'').toUpperCase() + '</div>';
    fields.forEach(function(f){ renderAuditFieldEditor(card, f); });
    const saveBtn = document.createElement('button'); saveBtn.className = 'primaryBtn'; saveBtn.textContent = '💾 Save & Back to Live Plays';
    saveBtn.addEventListener('click', async function(){ await saveAuditDraft(false); quickEditMode = false; resumeLivePlayLoop(); });
    card.appendChild(saveBtn);
    const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghostBtn'; cancelBtn.textContent = 'Cancel (Discard Changes)';
    cancelBtn.addEventListener('click', function(){ quickEditMode = false; resumeLivePlayLoop(); });
    card.appendChild(cancelBtn);
    area.appendChild(card);
  }
  // Nathan: "I can't see the play log in the entry screen." A live,
  // recent-plays list right in the play loop -- no need to leave the flow
  // (or guess) to confirm what actually got saved. Re-fetches fresh every
  // time it's opened, so an edit made through this same panel or through
  // Stat Keeper directly always shows up correctly.
  let recentPlaysOpen = false;
  let recentPlaysCache = [];
  async function toggleRecentPlays(){
    recentPlaysOpen = !recentPlaysOpen;
    if (recentPlaysOpen){
      try {
        const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
        const res = await fetch(url);
        const gs = res.ok ? await res.json() : null;
        recentPlaysCache = (gs && Array.isArray(gs.plays)) ? gs.plays.filter(function(p){ return p.type !== 'quarterEnd' && p.type !== 'timeout'; }).slice(0, 6) : [];
      } catch(e){ recentPlaysCache = []; }
    }
    renderWizard();
  }
  function renderRecentPlaysPanel(container){
    const wrap = document.createElement('div'); wrap.className = 'card'; wrap.style.padding = '10px'; wrap.style.marginBottom = '14px';
    const headRow = document.createElement('div'); headRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;cursor:pointer;';
    headRow.innerHTML = '<span style="font-weight:800;font-size:13px;">📋 Recent Plays</span><span style="font-size:12px;color:var(--dim);">' + (recentPlaysOpen ? 'Hide ▴' : 'Show ▾') + '</span>';
    headRow.addEventListener('click', toggleRecentPlays);
    wrap.appendChild(headRow);
    if (recentPlaysOpen){
      if (!recentPlaysCache.length){
        const empty = document.createElement('div'); empty.className = 'sub'; empty.style.margin = '8px 0 0'; empty.textContent = 'No plays logged yet.';
        wrap.appendChild(empty);
      }
      // Nathan (follow-up): "recent play history doesn't show anything -
      // should show the same way it does in the Stat Keeper." Two real
      // bugs fixed together here: (1) this row was a flex row with an
      // Edit button using .ghostBtn, which sets width:100% -- inside a
      // flex row with flex:0 0 auto and no explicit width override, that
      // 100% became the button's flex-basis, so it tried to claim the
      // WHOLE row and squeezed the text down to nothing, wrapping it into
      // a single narrow column exactly like the screenshot. Explicit
      // width:auto below fixes that outright. (2) the summary text itself
      // was a bare "TYPE · N yds" -- now it's the same describePlay/
      // spotBadgeText/downDistBadgeText Stat Keeper's own play log uses,
      // stacked the same way (tags on top, full description below).
      recentPlaysCache.forEach(function(p){
        const row = document.createElement('div');
        row.style.cssText = 'padding:8px 0;border-top:1px solid var(--line-bright);';
        const sideTag = p.side === 'offense' ? 'OFF' : p.side === 'defense' ? 'DEF' : '';
        const spotTxt = spotBadgeText(p), ddTxt = downDistBadgeText(p);
        const tagsRow = document.createElement('div');
        tagsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10px;font-weight:800;margin-bottom:4px;';
        tagsRow.innerHTML =
          (sideTag ? '<span style="color:' + (sideTag==='OFF'?'var(--cyan)':'var(--orange)') + ';">' + sideTag + '</span>' : '') +
          '<span style="color:var(--dim);">' + (p.type||'?').toUpperCase() + '</span>' +
          (ddTxt ? '<span style="color:var(--dim2);">' + escapeHtml(ddTxt) + '</span>' : '') +
          (spotTxt ? '<span style="color:#ffe14d;">📍 ' + escapeHtml(spotTxt) + '</span>' : '');
        row.appendChild(tagsRow);
        const bottomRow = document.createElement('div'); bottomRow.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;gap:10px;';
        const summary = document.createElement('div'); summary.style.cssText = 'font-size:13px;color:#fff;flex:1;min-width:0;';
        summary.textContent = describePlay(p);
        const editBtn = document.createElement('button'); editBtn.className = 'ghostBtn';
        editBtn.style.cssText = 'width:auto;margin:0;padding:5px 10px;font-size:11px;flex:0 0 auto;white-space:nowrap;';
        editBtn.textContent = '✏️ Edit';
        editBtn.addEventListener('click', function(){ openQuickEdit(p); });
        bottomRow.appendChild(summary); bottomRow.appendChild(editBtn);
        row.appendChild(bottomRow);
        wrap.appendChild(row);
      });
    }
    container.appendChild(wrap);
  }

  async function boot(){
    loadStatus.textContent = 'Signing in…';
    let ok = false;
    try { ok = await ensureCoachAuth(); } catch(e){ ok = false; }
    if (!ok){ loadStatus.textContent = 'Sign-in required — reload the page to try again.'; return; }
    loadStatus.textContent = 'Loading games…';
    try {
      const schedUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/schedule.json');
      const res = await fetch(schedUrl);
      const games = res.ok ? (await res.json() || []) : [];
      liveGamesCache = Array.isArray(games) ? games.filter(function(g){ return g && g.id; }) : [];
    } catch(e){ loadStatus.textContent = '⚠️ Could not load games: ' + e.message; return; }
    populateGameSelect();
    loadStatus.textContent = liveGamesCache.length ? 'Select a game above to begin.' : 'No games found on the schedule yet.';
    // Nathan: "I want this to be tied into Coach Nate profile where I have
    // a KEEP STATS CTA on the game card" -- once that link exists (see
    // schedule.js), it'll pass ?game=<id>; auto-select it here so tapping
    // the card drops the coach straight into setup instead of the picker.
    const params = new URLSearchParams(location.search);
    const gid = params.get('game');
    if (gid){ gameSelect.value = gid; loadGame(gid); }
  }
  boot();
})();
</script>
</body>
</html>
