<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASL Bengals — Keep Stats</title>
<!--
  Nathan: "I want to see about reconfiguring the STATKEEPER so it is more
  like the GameChanger game logging where its more of a wizard choosing
  the play... So again, it's like a wizard leading you through the
  selections. The STATKEEPER site will eventually become the back end
  tool to fine tune game details if they were entered wrong. Will add
  more to the plan as we go."

  This is PHASE 1 of that plan, not the whole thing: Confirm Starters →
  Coin Toss → Opening Kickoff, then a handoff into stat-keeper.html for
  the rest of the game (the snap-by-snap wizard -- formation/play/
  direction/motion-counter-boot tags, auto down & distance, timeouts,
  quarter-end events, a live searchable box score -- is the planned next
  phase, deliberately not attempted here untested in one shot).

  Everything this DOES write goes into the exact same statKeeperLogs/
  {gameId} shape stat-keeper.html and game-playback.html already read --
  a kickoff logged here is a real Stat Keeper play, editable there and
  visible in a replay, not a separate parallel data format.

  Duplicates rather than imports helpers from stat-keeper.html/
  game-playback.html, same reason those duplicate from each other: no
  build step or shared module system in this project.
-->
<style>
  :root{ --console:#1b1f26; --line-bright:#2c333d; --dim:#9aa4ae; --dim2:#6b7480; --cyan:#3ddcff; --orange:#ff8a3d; --bengal-orange:#ff6a13; }
  *{box-sizing:border-box}
  body{margin:0;background:#0b0e13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:60px}
  .topBar{padding:14px 16px 10px;border-bottom:1px solid var(--line-bright);position:sticky;top:0;background:#0b0e13;z-index:5}
  .topBar h1{margin:0 0 10px;font-size:15px;font-weight:800;letter-spacing:.02em}
  select#gameSelect{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line-bright);background:var(--console);color:#fff;font-size:14px}
  #loadStatus{font-size:11px;color:var(--dim2);margin-top:6px;text-align:center;min-height:14px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  .stepDots{display:flex;justify-content:center;gap:8px;margin:16px 0}
  .stepDot{width:8px;height:8px;border-radius:50%;background:var(--line-bright)}
  .stepDot.active{background:var(--cyan);width:20px;border-radius:4px}
  .stepDot.done{background:var(--dim2)}
  .card{background:var(--console);border:1px solid var(--line-bright);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:800}
  .card .sub{font-size:12px;color:var(--dim2);margin-bottom:14px}
  .groupSection{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
  .starterRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-bright)}
  .starterRow:last-child{border-bottom:none}
  .starterRow .posLabel{font-size:11px;color:var(--dim2);width:70px;flex:0 0 auto}
  .starterRow .starterName{font-size:14px;font-weight:700;flex:1}
  .starterRow .starterName.empty{color:var(--dim2);font-weight:400;font-style:italic}
  .swapBtn{padding:6px 12px;border-radius:8px;border:1px solid var(--line-bright);background:#12161c;color:var(--cyan);font-size:11px;font-weight:700;cursor:pointer}
  .altList{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-bright)}
  .altChip{padding:6px 10px;border-radius:16px;border:1px solid var(--line-bright);font-size:12px;color:var(--dim);cursor:pointer}
  .altChip:hover{color:#fff;border-color:var(--cyan)}
  .chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  /* Nathan: "we are on the sideline, so show a field display so I can
     choose left or right side." A real (if simple) field strip instead of
     "Near end/Far end" text buttons -- standing on the actual sideline,
     left/right relative to how you're already facing the field is
     immediate; "near/far" makes you translate first. */
  .sideFieldStrip{display:flex;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line-bright);margin-top:4px}
  .sideFieldHalf{flex:1;background:#1e5c2e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;border:2px solid transparent;position:relative}
  .sideFieldHalf:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px;background:repeating-linear-gradient(90deg,#1e5c2e 0,#1e5c2e 14px,#24692f 14px,#24692f 28px)}
  .sideFieldHalf:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px;background:repeating-linear-gradient(90deg,#24692f 0,#24692f 14px,#1e5c2e 14px,#1e5c2e 28px)}
  .sideFieldHalf.active{border-color:var(--cyan)}
  .sideFieldHalf .sideLabel{font-family:inherit;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .sideFieldHalf .sideShield{font-size:20px;opacity:0;transition:opacity .15s}
  .sideFieldHalf.active .sideShield{opacity:1}
  .sideFieldMid{width:2px;background:rgba(255,255,255,.5)}
  .optChip{padding:10px 16px;border-radius:10px;border:1px solid var(--line-bright);background:#12161c;color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;flex:1;text-align:center;min-width:100px}
  .optChip.active{background:var(--cyan);color:#04222b;border-color:var(--cyan)}
  .fieldLabel{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  .yardRow{display:flex;align-items:center;gap:8px}
  .stepBtn{width:34px;height:34px;border-radius:8px;background:#12161c;border:1px solid var(--line-bright);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none}
  .yardRow input{width:60px;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line-bright);background:#12161c;color:#fff;font-size:14px}
  .primaryBtn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff8a3d,#e0570a);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
  .primaryBtn[disabled]{opacity:.4;pointer-events:none}
  .ghostBtn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line-bright);background:transparent;color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
  .writeIn{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--line-bright);background:#12161c;color:#fff;font-size:13px;margin-top:8px}
  .summaryLine{font-size:13px;color:var(--dim);margin:6px 0}
  .summaryLine b{color:#fff}
  .emptyState{text-align:center;color:var(--dim2);padding:40px 20px;font-size:13px}
  .handoffIcon{font-size:40px;text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="topBar">
  <div class="wrap">
    <h1>🧙 Keep Stats — Game Setup</h1>
    <select id="gameSelect"><option value="">— Sign in to load games —</option></select>
    <div id="loadStatus"></div>
  </div>
</div>

<div class="wrap" id="wizardWrap" style="display:none;">
  <!-- Nathan: "Video is always visible in the top and should not start
       over or reload when a play is saved." Lives OUTSIDE #stepArea on
       purpose -- #stepArea gets wiped and rebuilt on every single
       renderWizard() call (i.e. after every play logged), and the film
       panel used to be built fresh inside it each time, tearing down and
       recreating the <iframe> -- which is exactly what was restarting the
       video on every save. This host is built once and just shown/hidden
       from then on; the same iframe, mid-playback, stays alive underneath. -->
  <div id="filmPanelHost" style="display:none;"></div>
  <div class="stepDots" id="stepDots"></div>
  <div id="stepArea"></div>
</div>

<div class="wrap" id="emptyWrap"><div class="emptyState">Pick a game above to start setting it up.</div></div>

<script>
(function(){
  // ---------------------------------------------------------------------
  // Ported verbatim from dev2/stat-keeper.html -- see that file's own
  // comment for why this project duplicates rather than shares modules.
  // ---------------------------------------------------------------------
  const FIREBASE_DB_URL = 'https://aslbengals-default-rtdb.firebaseio.com';
  const FIREBASE_API_KEY = 'AIzaSyCBvobt9qfyLoJOGUz6fIiGrFKMEQFsA3E';
  const COACH_CODE_HASH = 'fde7fd37696f9bc49c1e13a1dae70923a5ef1dec148e1ce16d5136519dac162d';
  const SIGNUP_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`;
  const SIGNIN_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`;
  const REFRESH_URL = `https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`;
  const GATE_SESSION_KEY = 'bengalsGateSession';
  const SAFETY_MARGIN_MS = 60000;
  let authCache = null;
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function loadGateSession(){ try { return JSON.parse(localStorage.getItem(GATE_SESSION_KEY) || 'null'); } catch(e){ return null; } }
  function saveGateSession(refreshToken){ try { localStorage.setItem(GATE_SESSION_KEY, JSON.stringify({refreshToken, kind:'coach'})); } catch(e){} }
  function hasGateSession(){ const s = loadGateSession(); return !!(s && s.refreshToken); }
  async function refreshIdToken(refreshToken){
    const res = await fetch(REFRESH_URL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}` });
    if (!res.ok) throw new Error('Token refresh failed: HTTP ' + res.status);
    const data = await res.json();
    return { idToken: data.id_token, refreshToken: data.refresh_token, expiresAt: Date.now() + Number(data.expires_in)*1000 };
  }
  async function signInWithCoachGate(passwordHash){
    const email = 'coach-gate@aslbengals.internal';
    let res = await fetch(SIGNUP_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: passwordHash, returnSecureToken: true }) });
    if (!res.ok){
      const errBody = await res.json().catch(() => ({}));
      const code = errBody.error && errBody.error.message;
      if (code === 'EMAIL_EXISTS'){
        res = await fetch(SIGNIN_URL, { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password: passwordHash, returnSecureToken: true }) });
        if (!res.ok) throw new Error('Gate sign-in failed: HTTP ' + res.status);
      } else { throw new Error('Gate account setup failed: ' + (code || res.status)); }
    }
    const data = await res.json();
    authCache = { idToken: data.idToken, refreshToken: data.refreshToken, expiresAt: Date.now() + Number(data.expiresIn)*1000 };
    saveGateSession(authCache.refreshToken);
    return authCache;
  }
  async function getFirebaseIdToken(){
    if (authCache && authCache.expiresAt - SAFETY_MARGIN_MS > Date.now()) return authCache.idToken;
    if (authCache && authCache.refreshToken){ authCache = await refreshIdToken(authCache.refreshToken); saveGateSession(authCache.refreshToken); return authCache.idToken; }
    const saved = loadGateSession();
    if (saved && saved.refreshToken){ authCache = await refreshIdToken(saved.refreshToken); saveGateSession(authCache.refreshToken); return authCache.idToken; }
    throw new Error('Not signed in');
  }
  async function firebaseAuthedUrl(url){
    const token = await getFirebaseIdToken();
    const sep = url.indexOf('?') === -1 ? '?' : '&';
    return `${url}${sep}auth=${encodeURIComponent(token)}`;
  }
  async function ensureCoachAuth(){
    if (hasGateSession()){ try { await getFirebaseIdToken(); return true; } catch(e){} }
    let code = null;
    try { code = prompt('Enter the coach code to set up this game:'); } catch(e){ return false; }
    if (!code) return false;
    const hash = await sha256Hex(code);
    if (hash !== COACH_CODE_HASH){ alert('Incorrect code.'); return false; }
    try { await signInWithCoachGate(hash); return true; } catch(e){ alert("Couldn't sign in: " + e.message); return false; }
  }

  function absoluteSpot(side, yard){
    if (!side || yard === '' || yard == null) return null;
    const y = Number(yard);
    if (isNaN(y)) return null;
    return side === 'OWN' ? y : (100 - y);
  }
  function spotLabelAbs(spot){
    const y = Math.round(spot <= 50 ? spot : (100 - spot));
    if (Math.round(spot) === 50) return 'Midfield (the 50)';
    return (spot <= 50 ? 'OWN ' : 'OPP ') + y;
  }
  function clampSpot(v){ return Math.max(0, Math.min(100, v)); }
  function spotLabel(side, yard){ if (!side || yard === '' || yard == null) return ''; return side + ' ' + yard; }
  function asList(v){ if (Array.isArray(v)) return v.filter(Boolean); return v ? [v] : []; }
  // Nathan (follow-up): "recent play history doesn't show anything -
  // should show the same way it does in the Stat Keeper." Ported directly
  // from stat-keeper.html/game-playback.html (both already had this)
  // rather than the much thinner one-line summary the Recent Plays panel
  // was using -- same descriptions, same spot/down-distance badges,
  // everywhere a play gets shown in this file now.
  function playRunTxt(p){
    if (!p.playCall) return '';
    const name = p.playCall === 'Other / Not Sure' ? (p.playCallOther || 'unknown call') : p.playCall;
    return ' [Ran: ' + name + (p.playCallDir ? ' ' + p.playCallDir : '') + ']';
  }
  function formationTxt(p){ return p.formation ? ' ['+p.formation + (p.formationDir ? ' '+p.formationDir : '') +']' : ''; }
  function coachCallTxt(p){
    if (!p.coachCall) return '';
    const name = p.coachCall === 'Other / Not Sure' ? (p.coachCallOther || 'unknown call') : p.coachCall;
    return ' [Called: ' + name + (p.coachCallDir ? ' ' + p.coachCallDir : '') + ']';
  }
  function coachFormationTxt(p){ return p.coachFormation ? ' [Called formation: '+p.coachFormation + (p.coachFormationDir ? ' '+p.coachFormationDir : '') +']' : ''; }
  function tackleTxt(p){
    if (!p.tackler && !asList(p.assist).length) return '';
    const assists = asList(p.assist);
    if (!p.tackler) return ' · tackled by ' + assists.join(' + ') + ' (assist)';
    return ' · tackled by ' + p.tackler + (assists.length ? ' + '+assists.join(' + ')+' (assist)' : '');
  }
  function spotBadgeText(p){
    if (p.startSide != null && p.endSide != null){
      const a = spotLabel(p.startSide, p.startYard), b = spotLabel(p.endSide, p.endYard);
      if (!a || !b) return '';
      return a === b ? a : (a + ' → ' + b);
    }
    if (p.catchSide != null && p.endSide != null){
      const a = spotLabel(p.catchSide, p.catchYard), b = spotLabel(p.endSide, p.endYard);
      if (!a || !b) return '';
      return a === b ? a : (a + ' → ' + b);
    }
    if (p.spotSide != null) return spotLabel(p.spotSide, p.spotYard);
    if (p.spot != null && !isNaN(p.spot)) return spotLabelAbs(p.spot);
    return '';
  }
  function downDistBadgeText(p){
    if (p.down == null || p.distance == null) return '';
    return ['1st','2nd','3rd','4th'][p.down-1] + ' & ' + p.distance;
  }
  function describePlay(p){
    if (p.type==='run'){
      const isUsRun = p.runTeam !== 'Opponent';
      const carrierTxt = isUsRun ? (p.carrier||'?') : ('Opponent' + (p.oppCarrier ? ' ('+p.oppCarrier+')' : ''));
      const prefix = isUsRun ? '' : '🛡️ ';
      const label = p.fumbledExchange ? 'Fumbled Exchange (not a rush attempt)' : 'Run';
      return prefix + (p.td?'🏆 ':'') + label + ' — ' + carrierTxt + ', ' + p.yards + ' yds' +
        (p.dir?' ('+p.dir+')':'') + (p.firstDown?' · 1st down':'') + (p.td?' · TD':'') + (p.oob?' · out of bounds':'') +
        (isUsRun ? formationTxt(p) + playRunTxt(p) + coachFormationTxt(p) + coachCallTxt(p) : tackleTxt(p));
    }
    if (p.type==='pass'){
      const isUsPass = p.passTeam !== 'Opponent';
      const passerTxt = isUsPass ? (p.passer||'?') : ('Opponent' + (p.oppPasser ? ' ('+p.oppPasser+')' : ''));
      const targetTxt = isUsPass ? (p.target||'?') : (p.oppTarget || 'opponent');
      const prefix = isUsPass ? '' : '🛡️ ';
      if (p.result==='Incomplete'){
        let reasonTxt = p.incReason ? ' (' + p.incReason + (p.incReason==='Broken Up' && p.pbuBy ? ' by '+p.pbuBy : '') + ')' : '';
        return prefix + 'Pass — ' + passerTxt + ' incomplete to ' + targetTxt + reasonTxt + (isUsPass ? formationTxt(p) + playRunTxt(p) + coachFormationTxt(p) + coachCallTxt(p) : '');
      }
      return prefix + (p.td?'🏆 ':'') + 'Pass — ' + passerTxt + ' to ' + targetTxt + ', ' + p.yards + ' yds' +
        (p.firstDown?' · 1st down':'') + (p.td?' · TD':'') + (p.oob?' · out of bounds':'') + (isUsPass ? formationTxt(p) + playRunTxt(p) + coachFormationTxt(p) + coachCallTxt(p) : tackleTxt(p));
    }
    if (p.type==='kick'){
      const isUsKick = p.kickTeam !== 'Opponent';
      if (p.onside){
        let base = (isUsKick ? '' : '🛡️ ') + '⚡ Onside Kick (' + (isUsKick?'Us':'Opponent') + ') — recovered by ' + (p.recoveredByTeam||'?') + (p.recoverPlayer ? ' ('+p.recoverPlayer+')' : '');
        if (p.recoveredByTeam==='Us' && p.returner) base += ', ' + p.returner + ' brought it ' + (p.yards||0) + ' yds';
        return base;
      }
      const catchTxt = spotLabel(p.catchSide, p.catchYard);
      const returnerTxt = isUsKick ? ('Opponent' + (p.oppReturner ? ' ('+p.oppReturner+')' : '')) : (p.returner||'?');
      const startAbs = absoluteSpot(p.startSide, p.startYard), catchAbs = absoluteSpot(p.catchSide, p.catchYard), endAbs = absoluteSpot(p.endSide, p.endYard);
      const kickDist = (startAbs != null && catchAbs != null) ? (isUsKick ? (catchAbs - startAbs) : (startAbs - catchAbs)) : null;
      const retYds = (catchAbs != null && endAbs != null) ? (isUsKick ? (catchAbs - endAbs) : (endAbs - catchAbs)) : null;
      let base = (isUsKick ? '' : '🛡️ ') + 'Kickoff (' + (isUsKick?'Us':'Opponent') + ')' + ', returned by ' + returnerTxt;
      if (catchTxt) base += ', caught at '+catchTxt;
      if (p.td) base += ' · 🏆 TD';
      if (kickDist != null) base += ' · '+kickDist+' yd kick';
      if (retYds != null) base += ' · '+retYds+' return yds';
      return base;
    }
    if (p.type==='punt'){
      const isUs = p.puntTeam !== 'Opponent';
      const catchTxt = spotLabel(p.catchSide, p.catchYard);
      const startAbs = absoluteSpot(p.startSide, p.startYard), catchAbs = absoluteSpot(p.catchSide, p.catchYard), endAbs = absoluteSpot(p.endSide, p.endYard);
      const net = (startAbs != null && endAbs != null) ? (isUs ? (endAbs - startAbs) : (startAbs - endAbs)) : null;
      const puntDist = (startAbs != null && catchAbs != null) ? (isUs ? (catchAbs - startAbs) : (startAbs - catchAbs)) : null;
      const retYds = (catchAbs != null && endAbs != null) ? (isUs ? (catchAbs - endAbs) : (endAbs - catchAbs)) : null;
      const puntGloss = isUs ? (p.punter||'?') : ('Opponent' + (p.oppPunter ? ' ('+p.oppPunter+')' : ''));
      let base = (isUs ? '' : '🚩 Forced Punt — ') + 'Punt — ' + puntGloss;
      if (p.puntResult === 'Returned'){
        if (isUs){
          const puntAssists = asList(p.assist);
          const tackleT = p.tackler ? ' · tackled by '+p.tackler+(puntAssists.length?' + '+puntAssists.join(' + ')+' (assist)':'') : '';
          base += ', returned by ' + (p.oppReturner || 'opponent');
          if (catchTxt) base += ', caught at '+catchTxt;
          base += tackleT;
        } else {
          base += ', returned by ' + (p.returner||'?');
          if (catchTxt) base += ', caught at '+catchTxt;
          base += (p.oppTackler ? ' · tackled by '+p.oppTackler : '');
        }
        if (p.td) base += ' · 🏆 TD';
        if (puntDist != null) base += ' · '+puntDist+' yd punt';
        if (retYds != null) base += ' · '+retYds+' return yds';
      } else { base += ' (' + (p.puntResult||'?') + ')'; }
      if (net != null) base += ' · net ' + net + ' yds';
      return base;
    }
    if (p.type==='kneel'){
      const isUsKneel = p.kneelTeam !== 'Opponent';
      const qbTxt = isUsKneel ? (p.qb ? ' — '+p.qb : '') : (' — Opponent' + (p.oppQb ? ' ('+p.oppQb+')' : ''));
      const lossTxt = (p.kneelType !== 'Spike' && p.kneelYards) ? ', -' + p.kneelYards + ' yds' : '';
      return (isUsKneel ? '' : '🛡️ ') + '🕐 ' + (p.kneelType||'Kneel') + qbTxt + lossTxt;
    }
    if (p.type==='tackle'){
      const assists = asList(p.assist);
      const base = (!p.tackler && assists.length)
        ? 'Tackle assist (rebuilt, no solo tackler known) — ' + assists.join(' + ')
        : 'Tackle — ' + (p.tackler||'?') + (assists.length ? ' + '+assists.join(' + ')+' (assist)' : ' (solo)');
      if (p.startSide != null && p.endSide != null){
        const startAbs = absoluteSpot(p.startSide, p.startYard), endAbs = absoluteSpot(p.endSide, p.endYard);
        const yards = signedYardsFromSpots(startAbs, endAbs, false);
        return base + ', ' + yards + ' yds' + (p.firstDown ? ' · Opponent 1st down' : '');
      }
      return base;
    }
    if (p.type==='defextra') return (p.td?'🏆 ':'') + (p.extraType||'?') + ' — ' + (p.player||'?') + (p.td?' · TD':'');
    if (p.type==='turnover') return (p.td?'🏆 ':'') + 'Turnover (' + (p.toType||'?') + ') — lost by ' + (p.lostBy||'?') +
      (p.recoveredBy ? ', recovered by '+p.recoveredBy : '') + (p.td?' · TD return':'') + (p.note ? ' — "'+p.note+'"' : '');
    if (p.type==='score') return '🏆 ' + (p.scoreKind||'Score') + ' — ' + (p.scoreTeam||'Us') + (p.scorePlayer ? ' ('+p.scorePlayer+')' : '');
    if (p.type==='penalty'){
      const penName = (p.penType==='Other' && p.penOther) ? p.penOther : (p.penType||'Penalty');
      const ydsTxt = p.declined ? 'declined' : (p.penYards||0)+' yds';
      return '🚩 ' + penName + ' on ' + (p.penTeam||'?') + (p.penPlayer ? ' ('+p.penPlayer+')' : '') +
        ', ' + ydsTxt + (p.firstDown ? ' · automatic 1st down' : '');
    }
    return 'Play';
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function genId(){ return 'play_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  // ---- Game/roster/depth chart loading ----
  const gameSelect = document.getElementById('gameSelect');
  const loadStatus = document.getElementById('loadStatus');
  const wizardWrap = document.getElementById('wizardWrap');
  const emptyWrap = document.getElementById('emptyWrap');
  let liveGamesCache = [];
  let liveRoster = [];
  let depthGroups = [];
  let selectedGame = null;

  function populateGameSelect(){
    gameSelect.innerHTML = '';
    const topOpt = document.createElement('option'); topOpt.value=''; topOpt.textContent='— Select a game —';
    gameSelect.appendChild(topOpt);
    liveGamesCache.slice().sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999')).forEach(function(g){
      const opt = document.createElement('option');

      gameSelect.appendChild(opt);
    });
  }
  function rosterByNum(){
    const m = {};
    liveRoster.forEach(function(p){ if (p && p.num != null) m[String(p.num)] = p; });
    return m;
  }
  function playerLabel(p){ return p ? ('#' + p.num + ' ' + p.name) : null; }

  gameSelect.addEventListener('change', function(){ loadGame(gameSelect.value); });

  async function loadGame(gameId){
    if (!gameId){ wizardWrap.style.display='none'; emptyWrap.style.display=''; return; }
    selectedGame = liveGamesCache.find(function(g){ return g.id === gameId; }) || null;
    if (!selectedGame){ loadStatus.textContent = 'Could not find this game.'; return; }
    loadStatus.textContent = 'Checking for an existing log…';
    let existingGameState = null;
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + gameId + '.json');
      const res = await fetch(url);
      existingGameState = res.ok ? await res.json() : null;
    } catch(e){ /* fine to proceed without knowing -- worst case this just looks like a fresh game */ }
    loadStatus.textContent = 'Loading roster & depth chart…';
    try {
      const rosterUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/teamRoster.json');
      const rosterRes = await fetch(rosterUrl);
      liveRoster = rosterRes.ok ? (await rosterRes.json() || []) : [];
      liveRoster = Array.isArray(liveRoster) ? liveRoster.filter(function(p){ return p && p.id; }) : [];
      const depthUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/depthChart.json');
      const depthRes = await fetch(depthUrl);
      const depthData = depthRes.ok ? await depthRes.json() : null;
      depthGroups = (depthData && Array.isArray(depthData.groups)) ? depthData.groups : [];

    loadStatus.textContent = '';
    wizardWrap.style.display = ''; emptyWrap.style.display = 'none';
    wiz.state = { starters: {}, tossWinner: null, tossChoice: null, receivingTeam: null, endNote: null };
    // Nathan: "If I use the wizard, will that redo the entire game over
    // again? What is the best approach to amend the first game." Used to
    // just ask "run through setup again?" and, either way, still made you
    // walk Starters -> Coin Toss -> Kickoff before you could log a single
    // play -- there was never an actual way to just pick up where an
    // existing log left off. Now: any game with plays already on it stops
    // at a resume screen instead of forcing the full setup again.
    if (existingGameState && Array.isArray(existingGameState.plays) && existingGameState.plays.length){
      wiz.resumeGameState = existingGameState;
      wiz.step = 'resume';
    } else {
      wiz.step = 0;
    }
    renderWizard();
  }

  // ---- Wizard shell ----
  const STEPS = ['Starters', 'Coin Toss', 'Kickoff', 'Playing'];
  const wiz = { step: 0, state: {} };
  function renderDots(){
    if (wiz.step === 'resume' || wiz.step === 'audit' || wiz.step === 'quickEdit'){ document.getElementById('stepDots').innerHTML = ''; return; }
    document.getElementById('stepDots').innerHTML = STEPS.map(function(_, i){
      const cls = i === wiz.step ? 'active' : (i < wiz.step ? 'done' : '');
      return '<div class="stepDot ' + cls + '"></div>';
    }).join('');
  }
  function renderWizard(){
    renderDots();
    const area = document.getElementById('stepArea');
    area.innerHTML = '';
    // Nathan: "Video is always visible in the top." Shown for both the
    // live play loop AND Audit Mode (the two screens actually about
    // logging/reviewing plays against the film) -- hidden during one-time
    // setup (Starters/Coin Toss/Kickoff/Resume), which isn't watching film
    // yet. Showing/hiding never touches the iframe itself (see
    // ensureFilmPanelBuilt above), so it's never mid-play when this runs.
    const filmHost = document.getElementById('filmPanelHost');
    const wantsFilm = (wiz.step === 'audit' || wiz.step === 'quickEdit' || (typeof wiz.step === 'number' && wiz.step === 3));
    if (wantsFilm && selectedGame) ensureFilmPanelBuilt();
    filmHost.style.display = wantsFilm ? '' : 'none';
    if (wiz.step === 'resume') renderResumeStep(area);
    else if (wiz.step === 'audit') renderAuditStep(area);
    else if (wiz.step === 'quickEdit') renderQuickEditStep(area);
    else if (wiz.step === 0) renderStartersStep(area);
    else if (wiz.step === 1) renderCoinTossStep(area);
    else if (wiz.step === 2) renderKickoffStep(area);
    else renderPlayLoopStep(area);
  }

  // Nathan: "the coach on the sideline doing the play calls won't be
  // visible" when logging from film after the fact -- best-effort guess at
  // who currently has the ball from the most recent real play, using the
  // same `side`/team fields every play already carries (a run/pass/kneel's
  // own `side`, or the actual team that just kicked/punted/turned it over
  // for a possession-change play). Shown to the coach to confirm/flip
  // rather than trusted blindly, same "always correctable" rule as
  // everything else spot-related in this app -- inferring this wrong and
  // never asking would quietly corrupt every down/distance call after it.
  function inferPossession(plays){
    const last = (plays || []).find(function(p){ return p.type !== 'quarterEnd' && p.type !== 'timeout'; });
    if (!last) return 'Us';
    if (last.type === 'kick') return last.kickTeam === 'Opponent' ? 'Us' : 'Opponent'; // receiving team, not kicking team, has it now
    if (last.type === 'punt') return last.puntTeam === 'Opponent' ? 'Us' : 'Opponent';
    if (last.type === 'turnover') return last.side === 'offense' ? 'Opponent' : 'Us';
    if (last.type === 'defextra') return 'Us'; // this app's defextra (INT/PBU/Sack) always credits one of our own players
    return last.side === 'offense' ? 'Us' : 'Opponent';
  }
  // Nathan: "It also doesn't appear to be a way of getting back to the
  // game caller portion entering the plays without exiting." Audit Mode's
  // exit used to just call loadGame(), which reloads everything AND lands
  // back on the "Continue This Game" resume screen -- an extra tap and a
  // full reload just to keep logging live plays. This jumps straight into
  // the play loop instead, pulling the freshest spot/down/distance/quarter
  // (in case anything was corrected during the review) and keeping
  // whatever possession was already set rather than re-guessing it.
  async function resumeLivePlayLoop(){
    loadStatus.textContent = 'Loading current game state…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const gs = res.ok ? await res.json() : null;
      if (!gs){ loadStatus.textContent = ''; wiz.step = 0; renderWizard(); return; }
      const possession = (wiz.game && wiz.game.possession) ? wiz.game.possession : inferPossession(gs.plays);
      wiz.game = {
        spot: typeof gs.spot === 'number' ? gs.spot : 50,
        down: gs.down || 1, distance: gs.distance || 10, quarter: gs.quarter || 1,
        scoreUs: Number(gs.finalUs) || 0, scoreOpp: Number(gs.finalOpp) || 0,
        possession: possession,
        defendingEnd: (wiz.game && wiz.game.defendingEnd) || 'Left',
      };
      wiz.play = { phase: wiz.game.possession === 'Us' ? 'callCheck' : 'playType' };
      wiz.step = 3;
      loadStatus.textContent = '';
      renderWizard();
    } catch(e){ loadStatus.textContent = '⚠️ Could not resume: ' + e.message; }
  }
  function renderResumeStep(area){
    const gs = wiz.resumeGameState;
    const card = document.createElement('div'); card.className = 'card';
    if (wiz.resumePossessionOverride == null) wiz.resumePossessionOverride = inferPossession(gs.plays);
    card.innerHTML = '<h2>▶️ Continue This Game</h2><div class="sub">' + gs.plays.length + ' play(s) already logged. Pick up right where it left off, no need to redo Starters/Coin Toss/Kickoff.</div>' +
      '<div class="summaryLine">📍 <b>' + spotLabelAbs(typeof gs.spot === 'number' ? gs.spot : 50) + '</b> · ' + ['1st','2nd','3rd','4th'][(gs.down||1)-1] + ' &amp; ' + (gs.distance||10) + ' · ' + quarterLbl(gs.quarter||1) + '</div>';
    chipGroupFieldFake(card, 'Who has the ball right now?', ['Us','Opponent'], wiz.resumePossessionOverride, function(v){ wiz.resumePossessionOverride = v; renderWizard(); });
    const cont = document.createElement('button'); cont.className = 'primaryBtn'; cont.textContent = '▶️ Continue Logging Plays';
    cont.addEventListener('click', function(){
      wiz.game = {
        spot: typeof gs.spot === 'number' ? gs.spot : 50,
        down: gs.down || 1, distance: gs.distance || 10, quarter: gs.quarter || 1,
        scoreUs: Number(gs.finalUs) || 0, scoreOpp: Number(gs.finalOpp) || 0,
        possession: wiz.resumePossessionOverride,
        defendingEnd: 'Left',
      };
      wiz.play = { phase: wiz.game.possession === 'Us' ? 'callCheck' : 'playType' };
      wiz.step = 3;
      renderWizard();
    });
    card.appendChild(cont);
    // Nathan: "The Game Wizard was done prior to plays being added, same
    // for starting ball spot and ending ball spot... only some of the
    // plays are effected by it. I need to be able to open that game and
    // update the entire existing play log... If the wizard showed the info
    // it has on the play (saying none if it wasn't included) then I
    // should have an option to update for that play."
    const auditBtn = document.createElement('button'); auditBtn.className = 'primaryBtn'; auditBtn.style.background = 'linear-gradient(135deg,#3ddcff,#0a8ab0)';
    auditBtn.textContent = '🔍 Review & Fill In Missing Info';
    auditBtn.addEventListener('click', function(){ startAuditMode(gs); });
    card.appendChild(auditBtn);
    const startOver = document.createElement('button'); startOver.className = 'ghostBtn'; startOver.textContent = '🔄 Start Over From Kickoff Instead';
    startOver.addEventListener('click', function(){ wiz.step = 0; renderWizard(); });
    card.appendChild(startOver);
    const differentGame = document.createElement('button'); differentGame.className = 'ghostBtn'; differentGame.textContent = 'Pick a Different Game';
    differentGame.addEventListener('click', function(){ gameSelect.value = ''; wizardWrap.style.display = 'none'; emptyWrap.style.display = ''; });
    card.appendChild(differentGame);
    area.appendChild(card);
  }
  // Tiny one-off chip row for the resume screen, before PLAYBOOK/chipGroupField
  // (defined further down, in the play-loop section) exist yet in source
  // order -- functionally identical, just named separately to avoid relying
  // on wiz.play (which doesn't exist yet at this point in the flow).
  function chipGroupFieldFake(container, label, options, current, onSelect){
    const wrap = document.createElement('div');
    wrap.innerHTML = '<div class="fieldLabel">' + escapeHtml(label) + '</div>';
    const row = document.createElement('div'); row.className = 'chipRow';
    options.forEach(function(v){
      const c = document.createElement('div'); c.className = 'optChip' + (current === v ? ' active' : '');
      c.textContent = v;
      c.addEventListener('click', function(){ onSelect(v); });
      row.appendChild(c);
    });
    wrap.appendChild(row);
    container.appendChild(wrap);
  }

  // ---- Step 1: Confirm Starters ----
  // Nathan: "Confirm starters for ease of picking players to assign to
  // plays." Reads Coach Tools > Depth Chart (each position group's
  // players[0] is its current starter) rather than inventing a second
  // starters list -- this step is about CATCHING a stale depth chart
  // before game day (an injury, a sub who's been starting all season that
  // the chart was never updated for), not replacing it.
  function renderStartersStep(area){
    const byNum = rosterByNum();
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h2>Confirm Starters</h2><div class="sub">Auto-filled from Coach Tools &gt; Depth Chart -- tap anyone to swap in whoever\'s actually starting today. Backups rotate in a lot, so swapping isn\'t limited to that position\'s own depth list -- it\'s the whole roster.</div>';
    ['offense','defense'].forEach(function(section){
      const groups = depthGroups.filter(function(g){ return g.section === section; });
      if (!groups.length) return;
      const sec = document.createElement('div'); sec.className = 'groupSection'; sec.textContent = section === 'offense' ? 'Offense' : 'Defense';
      card.appendChild(sec);
      groups.forEach(function(g){
        const starterNum = g.players && g.players[0];
        const starter = starterNum ? byNum[String(starterNum)] : null;
        const key = g.id;
        if (wiz.state.starters[key] === undefined) wiz.state.starters[key] = starter ? String(starter.num) : null;
        const row = document.createElement('div'); row.className = 'starterRow';
        const chosenNum = wiz.state.starters[key];
        const chosen = chosenNum ? byNum[String(chosenNum)] : null;
        row.innerHTML = '<span class="posLabel">' + escapeHtml(g.label) + '</span>' +
          '<span class="starterName' + (chosen ? '' : ' empty') + '">' + (chosen ? escapeHtml(playerLabel(chosen)) : 'Nobody set') + '</span>' +
          '<span class="swapBtn">Swap</span>';
        const swapBtn = row.querySelector('.swapBtn');
        let altsOpen = false;
        swapBtn.addEventListener('click', function(){
          altsOpen = !altsOpen;
          let alts = row.querySelector('.altList');
          if (alts) { alts.remove(); if (!altsOpen) return; }
          // Nathan: "since backups also play a lot to rotate, we need the
          // ability to choose whomever." Used to only offer this
          // position's OWN depth-chart backups (g.players) -- a rotation
          // sub is often someone who isn't even listed at this position at
          // all, so the full roster is the right candidate list, not a
          // narrower one. This position's own listed players still show
          // first since they're the likeliest picks, then everyone else,
          // with a filter box since the full roster is a lot of chips to
          // scan on a phone.
          const ownNums = (g.players || []).map(String);
          const own = ownNums.map(function(n){ return byNum[n]; }).filter(Boolean);
          const rest = liveRoster.filter(function(p){ return ownNums.indexOf(String(p.num)) === -1; })
            .slice().sort(function(a,b){ return Number(a.num) - Number(b.num); });
          const wrap = document.createElement('div'); wrap.className = 'altList';
          wrap.style.flexDirection = 'column'; wrap.style.alignItems = 'stretch';
          const filterInput = document.createElement('input');
          filterInput.className = 'writeIn'; filterInput.type = 'text'; filterInput.placeholder = '🔍 Filter by name or number…';
          filterInput.style.marginTop = '0'; filterInput.style.marginBottom = '8px';
          wrap.appendChild(filterInput);
          const chipWrap = document.createElement('div'); chipWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
          wrap.appendChild(chipWrap);
          function renderChips(filterText){
            chipWrap.innerHTML = '';
            const ft = (filterText || '').trim().toLowerCase();
            function matches(p){
              if (!ft) return true;
              // Same number-precision fix as the play-loop's player chooser.
              return /^\d+$/.test(ft) ? String(p.num).indexOf(ft) === 0 : p.name.toLowerCase().indexOf(ft) !== -1;
            }
            own.filter(matches).forEach(function(p){ chipWrap.appendChild(altChip(p, true)); });
            rest.filter(matches).forEach(function(p){ chipWrap.appendChild(altChip(p, false)); });
            const noneChip = document.createElement('div'); noneChip.className = 'altChip'; noneChip.textContent = 'None';
            noneChip.addEventListener('click', function(){ wiz.state.starters[key] = null; renderWizard(); });
            chipWrap.appendChild(noneChip);
          }
          function altChip(p, isOwn){
            const chip = document.createElement('div'); chip.className = 'altChip';
            chip.textContent = playerLabel(p) + (isOwn ? '' : ' ·'); // subtle marker so "this position's own list" vs "rest of roster" is still distinguishable once combined
            chip.title = isOwn ? 'Listed at ' + g.label + ' on the depth chart' : 'Rest of roster';
            chip.addEventListener('click', function(){ wiz.state.starters[key] = String(p.num); renderWizard(); });
            return chip;
          }
          filterInput.addEventListener('input', function(){ renderChips(filterInput.value); });
          renderChips('');
          row.appendChild(wrap);
          filterInput.focus();
        });
        card.appendChild(row);
      });
    });
    // Nathan: "it should start to auto populate a selection from the
    // roster that you can confirm." A team with no depth chart saved yet
    // used to just show a "nothing to pick from" note here -- now it
    // falls back to the roster itself, auto-checking nobody but making
    // every player available to mark as starting today, so there's always
    // something to confirm/adjust instead of an empty step.
    if (!depthGroups.length){
      const sec = document.createElement('div'); sec.className = 'groupSection'; sec.textContent = 'Whole Roster (no depth chart saved yet)';
      card.appendChild(sec);
      if (!wiz.state.rosterStarters) wiz.state.rosterStarters = {};
      const rosterWrap = document.createElement('div'); rosterWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';
      liveRoster.slice().sort(function(a,b){ return Number(a.num) - Number(b.num); }).forEach(function(p){
        const on = !!wiz.state.rosterStarters[p.num];
        const chip = document.createElement('div'); chip.className = 'altChip' + (on ? ' active' : '');
        if (on) chip.style.cssText = 'border-color:var(--cyan);color:#fff;background:rgba(61,220,255,.12)';
        chip.textContent = playerLabel(p);
        chip.addEventListener('click', function(){ wiz.state.rosterStarters[p.num] = !on; renderWizard(); });
        rosterWrap.appendChild(chip);
      });
      card.appendChild(rosterWrap);
      const note = document.createElement('div'); note.className = 'sub'; note.style.marginTop = '10px';
      note.textContent = 'Tap everyone starting today. For a real position-by-position quick-pick list, set one up in Coach Tools > Depth Chart.';
      card.appendChild(note);
    }
    const btn = document.createElement('button'); btn.className = 'primaryBtn'; btn.textContent = 'Confirm Starters →';
    btn.addEventListener('click', function(){ wiz.step = 1; renderWizard(); });
    card.appendChild(btn);
    area.appendChild(card);
  }

  // ---- Step 2: Coin Toss ----
  function renderCoinTossStep(area){
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h2>🪙 Coin Toss</h2><div class="sub">Sets who gets the ball first.</div>';

    const q1 = document.createElement('div');
    q1.innerHTML = '<div class="fieldLabel">Who won the toss?</div>';
    const r1 = document.createElement('div'); r1.className = 'chipRow';
    ['Us','Opponent'].forEach(function(v){
      const c = document.createElement('div'); c.className = 'optChip' + (wiz.state.tossWinner === v ? ' active' : ''); c.textContent = v;
      c.addEventListener('click', function(){ wiz.state.tossWinner = v; renderWizard(); });
      r1.appendChild(c);
    });
    q1.appendChild(r1);
    card.appendChild(q1);

    if (wiz.state.tossWinner){
      const q2 = document.createElement('div');
      q2.innerHTML = '<div class="fieldLabel">What did ' + (wiz.state.tossWinner === 'Us' ? 'we' : 'they') + ' choose?</div>';
      const r2 = document.createElement('div'); r2.className = 'chipRow';
      [['Receive','Take the ball first'], ['Defer','Kick first, receive to open the 2nd half']].forEach(function(pair){
        const c = document.createElement('div'); c.className = 'optChip' + (wiz.state.tossChoice === pair[0] ? ' active' : '');
        c.textContent = pair[0];
        c.addEventListener('click', function(){
          wiz.state.tossChoice = pair[0];
          const winnerReceives = pair[0] === 'Receive';
          wiz.state.receivingTeam = winnerReceives ? wiz.state.tossWinner : (wiz.state.tossWinner === 'Us' ? 'Opponent' : 'Us');
          renderWizard();
        });
        r2.appendChild(c);
      });
      q2.appendChild(r2);
      card.appendChild(q2);
    }

    if (wiz.state.receivingTeam){
      const summary = document.createElement('div'); summary.className = 'summaryLine';
      summary.innerHTML = '📋 <b>' + escapeHtml(wiz.state.receivingTeam) + '</b> receives the opening kickoff.';
      card.appendChild(summary);

      const q3 = document.createElement('div');
      q3.innerHTML = '<div class="fieldLabel">Which end do we defend first? (for the sideline -- doesn\'t change how anything gets logged)</div>';
      const strip = document.createElement('div'); strip.className = 'sideFieldStrip';
      ['Left','Right'].forEach(function(v){
        const half = document.createElement('div'); half.className = 'sideFieldHalf' + (wiz.state.endNote === v ? ' active' : '');
        half.innerHTML = '<span class="sideShield">🛡️</span><span class="sideLabel">' + v + '</span>';
        half.addEventListener('click', function(){ wiz.state.endNote = v; renderWizard(); });
        strip.appendChild(half);
      });
      q3.appendChild(strip);
      card.appendChild(q3);

      const btn = document.createElement('button'); btn.className = 'primaryBtn'; btn.textContent = 'Continue to Kickoff →';
      btn.addEventListener('click', function(){ wiz.step = 2; renderWizard(); });
      card.appendChild(btn);
    }

    const back = document.createElement('button'); back.className = 'ghostBtn'; back.textContent = '← Back';
    back.addEventListener('click', function(){ wiz.step = 0; renderWizard(); });
    card.appendChild(back);
    area.appendChild(card);
  }

  // ---- Step 3: Opening Kickoff ----
  // Nathan: "Kickoff, you can mark where the ball landed, where it ended
  // and who carried it." Kicking team is already decided by the coin
  // toss (whoever ISN'T receiving); starts from the kicker's own 40, same
  // fixed-by-rule convention stat-keeper.html's kickoffStartSpotRow uses.
  function spotPicker(state, sideKey, yardKey, defaultYard, onChange){
    if (state[sideKey] == null) state[sideKey] = 'OWN';
    if (state[yardKey] == null) state[yardKey] = defaultYard;
    const wrap = document.createElement('div');
    const chipRow = document.createElement('div'); chipRow.className = 'chipRow';
    [['OWN','Our Side'],['OPP',"Opponent's Side"]].forEach(function(pair){
      const c = document.createElement('div'); c.className = 'optChip' + (state[sideKey] === pair[0] ? ' active' : ''); c.textContent = pair[1];
      c.addEventListener('click', function(){ state[sideKey] = pair[0]; onChange(); });
      chipRow.appendChild(c);
    });
    wrap.appendChild(chipRow);
    const yardRow = document.createElement('div'); yardRow.className = 'yardRow'; yardRow.style.marginTop = '6px';
    const minus = document.createElement('div'); minus.className = 'stepBtn'; minus.textContent = '−';
    const input = document.createElement('input'); input.type = 'number'; input.min = 0; input.max = 50; input.value = state[yardKey];
    const plus = document.createElement('div'); plus.className = 'stepBtn'; plus.textContent = '+';
    minus.addEventListener('click', function(){ state[yardKey] = Math.max(0, Number(input.value||0) - 1); onChange(); });
    plus.addEventListener('click', function(){ state[yardKey] = Math.min(50, Number(input.value||0) + 1); onChange(); });
    input.addEventListener('change', function(){ state[yardKey] = Math.max(0, Math.min(50, Number(input.value||0))); onChange(); });
    yardRow.appendChild(minus); yardRow.appendChild(input); yardRow.appendChild(plus);
    const suffix = document.createElement('span'); suffix.style.cssText = 'color:var(--dim);font-size:12px;margin-left:4px;'; suffix.textContent = 'yard line';
    yardRow.appendChild(suffix);
    wrap.appendChild(yardRow);
    return wrap;
  }
  function renderKickoffStep(area){
    const isUsKick = wiz.state.receivingTeam !== 'Us'; // whoever ISN'T receiving is kicking
    if (!wiz.state.kickoff) wiz.state.kickoff = { catchSide:null, catchYard:20, endSide:null, endYard: isUsKick ? 30 : 40, returner:'' };
    const k = wiz.state.kickoff;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h2>🏈 Opening Kickoff</h2><div class="sub"><b>' + (isUsKick ? 'We' : 'They') + '</b> kick from ' + (isUsKick ? 'our' : 'their') + ' own 40. Mark where it was caught and where the return ended.</div>';

    card.innerHTML += '<div class="fieldLabel">Caught / Fielded At</div>';
    card.appendChild(spotPicker(k, 'catchSide', 'catchYard', isUsKick ? 20 : 15, renderWizard));

    const lbl2 = document.createElement('div'); lbl2.className = 'fieldLabel'; lbl2.textContent = 'Brought Ball To (final spot)';
    card.appendChild(lbl2);
    card.appendChild(spotPicker(k, 'endSide', 'endYard', isUsKick ? 30 : 40, renderWizard));

    if (isUsKick){
      const lbl3 = document.createElement('div'); lbl3.className = 'fieldLabel'; lbl3.textContent = 'Returner (optional, opponent -- if known)';
      card.appendChild(lbl3);
      // Opponent returner -- not on our roster, so a plain write-in field
      // is the right tool here, not roster pills.
      const input = document.createElement('input'); input.className = 'writeIn'; input.type = 'text';
      input.placeholder = "Opponent's returner, if known";
      input.value = k.returner || '';
      input.addEventListener('input', function(){ k.returner = input.value; });
      card.appendChild(input);
    } else {
      // Nathan: "as I start to enter the name in the field, it should auto
      // recommend players on the roster. Or give me some pills under the
      // bar with common players." Our own returner IS on the roster, so
      // this gets the same starters-first, full-roster-searchable chooser
      // as everywhere else in the play loop (it renders its own label).
      renderPlayerChooser(card, 'Returner', k, 'returner', {optional:true});
    }

    const btn = document.createElement('button'); btn.className = 'primaryBtn'; btn.textContent = '✅ Log Kickoff & Start Game';
    btn.addEventListener('click', commitKickoff);
    card.appendChild(btn);
    const back = document.createElement('button'); back.className = 'ghostBtn'; back.textContent = '← Back';
    back.addEventListener('click', function(){ wiz.step = 1; renderWizard(); });
    card.appendChild(back);

  async function commitKickoff(){
    const isUsKick = wiz.state.receivingTeam !== 'Us';
    const k = wiz.state.kickoff;
    const entry = {
      type: 'kick', id: genId(), side: isUsKick ? 'offense' : 'defense', quarter: 1,
      kickTeam: isUsKick ? 'Us' : 'Opponent', onside: false,
      startSide: isUsKick ? 'OWN' : 'OPP', startYard: 40, // fixed kickoff spot, same convention Stat Keeper already uses
      catchSide: k.catchSide, catchYard: k.catchYard, endSide: k.endSide, endYard: k.endYard,
    };
    if (isUsKick) entry.oppReturner = k.returner || ''; else entry.returner = k.returner || '';

    loadStatus.textContent = 'Signing in…';
    const ok = await ensureCoachAuth();
    if (!ok){ loadStatus.textContent = ''; return; }
    loadStatus.textContent = 'Saving…';
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const res = await fetch(url);
      const existing = res.ok ? await res.json() : null;
      // Stat Keeper stores newest-first (see game-playback.html's own note
      // on this) -- this kickoff IS the oldest play in the game, so it
      // belongs at the very END of the array, not unshifted to the front.
      const plays = (existing && Array.isArray(existing.plays)) ? existing.plays.slice() : [];
      plays.push(entry);
      const endAbs = absoluteSpot(entry.endSide, entry.endYard);
      const gameState = {
        plays: plays,
        quarter: 1,
        spot: endAbs != null ? clampSpot(endAbs) : 50,
        down: 1, distance: 10,
        finalUs: (existing && existing.finalUs) || '',
        finalOpp: (existing && existing.finalOpp) || '',
        updatedAt: new Date().toISOString(),
      };
      const putUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + selectedGame.id + '.json');
      const putRes = await fetch(putUrl, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gameState) });
      if (!putRes.ok) throw new Error('HTTP ' + putRes.status);
      // Nathan: "the wizard should walk you through continuously." Seeds
      // the running game state the play loop uses from here on --
      // possession starts with whoever just received.
      wiz.game = {
        spot: gameState.spot, down: 1, distance: 10, quarter: 1,
        scoreUs: 0, scoreOpp: 0, possession: wiz.state.receivingTeam,
        // Nathan: "It will automatically flip the field and retain down,
        // distance and possession" for end of 2nd/3rd quarter (and, same
        // rule, every quarter -- teams switch ends every quarter, not
        // just at halftime). This is purely the sideline-orientation
        // indicator from the coin toss, carried into the game header
        // below; it never touches spot/down/distance/possession, which
        // is exactly why those stay untouched across a quarter change --
        // see logEvent('quarterEnd').
        defendingEnd: wiz.state.endNote || 'Left',
      };
      // Nathan (follow-up): "it wouldn't recognize the first option to
      // choose the play after kickoff. I had to leave and come back for
      // it to show up." Real bug, not a rendering hiccup: this was
      // hardcoded to 'callCheck' regardless of who actually received the
      // kickoff. The play loop only knows how to show 'callCheck' when
      // WE have the ball (there's no sideline call to check when the
      // opponent has it) -- so if the other team received, this landed on
      // a phase with no matching screen at all: blank, unresponsive,
      // looked exactly like it "wouldn't recognize" anything. Leaving and
      // coming back worked around it by accident, because the Resume
      // screen picks the phase correctly. Same possession + film-review
      // check startNextPlay() already uses correctly, applied here too.
      wiz.play = { phase: (wiz.game.possession === 'Us' && !filmReviewMode) ? 'callCheck' : 'playType' };
    } catch(e){ loadStatus.textContent = '⚠️ Could not save: ' + e.message; return; }
    loadStatus.textContent = '';
    wiz.step = 3;
    renderWizard();
  }

  // ---- Step 4+: Continuous Play Loop ----
  // Nathan: "the wizard should walk you through continuously... Since we
  // already know we are scoring for the Bengals, we automatically get the
  // Offense Play Options." wiz.game tracks the running spot/down/distance/
  // score/possession (same shape stat-keeper.html's own state does);
  // wiz.play is the ONE play currently being built, phase by phase, reset
  // after every commit. Reuses stat-keeper.html's exact play-type fields
  // and math (formations, playbook, spot/down-distance advance) rather
  // than inventing a second version of any of it.
  const PLAYBOOK = ['Inside Zone','Outside Zone','Option','Blast','Double Blast','Option Pass','Sweep','Shuffle Pass'];
  const FORMATIONS = ['Wing','Split'];
  const PLAY_TAGS = ['Motion','Counter','Boot/Naked','Play-Action'];

  function getQuickPickPlayers(){
    const nums = {};
    Object.keys(wiz.state.starters || {}).forEach(function(k){ if (wiz.state.starters[k]) nums[wiz.state.starters[k]] = true; });
    Object.keys(wiz.state.rosterStarters || {}).forEach(function(n){ if (wiz.state.rosterStarters[n]) nums[n] = true; });
    const byNum = rosterByNum();
    return Object.keys(nums).map(function(n){ return byNum[n]; }).filter(Boolean).sort(function(a,b){ return Number(a.num)-Number(b.num); });
  }
  // Nathan (follow-up): "since backups also play a lot to rotate, we need
  // the ability to choose whomever." Same starters-first-then-full-roster-
  // with-a-filter shape as the Confirm Starters swap picker -- confirmed
  // starters are the fast path, but nobody's locked out.
  function renderPlayerChooser(container, label, stateObj, key, opts){
    opts = opts || {};
    const multi = !!opts.multi;

    wrap.innerHTML = '<div class="fieldLabel">' + escapeHtml(label) + (opts.optional ? ' (optional)' : '') + '</div>';

    // describePlay everywhere just prints whatever's in this field as the
    // display text directly. Storing the number here was a real bug: it
    // would have shown a bare jersey number instead of a name on every
    // carrier/passer/tackler in the whole play loop, not just here.
    function selected(){ return multi ? (stateObj[key] || []) : (stateObj[key] ? [stateObj[key]] : []); }
    if (quick.length){
      const hotRow = document.createElement('div'); hotRow.className = 'chipRow';
      quick.forEach(function(p){
        const chip = document.createElement('div');
        chip.className = 'optChip' + (selected().indexOf(p.name) !== -1 ? ' active' : '');
        chip.style.cssText = 'flex:0 0 auto;min-width:auto;padding:8px 12px;font-size:12px;';

        hotRow.appendChild(chip);
      });
      wrap.appendChild(hotRow);
    }
    const filterInput = document.createElement('input'); filterInput.className = 'writeIn';
    filterInput.placeholder = '🔍 Search full roster, or type a name…';
    // Nathan: "as I start to enter the name in the field, it should auto
    // recommend players." Typing now does double duty: it filters the
    // roster into matching pills below AND, on anyone not on the roster
    // at all (a sub), just typing and moving on saves that free-text name
    // directly -- same "write in a name" escape hatch Stat Keeper has.
    if (!multi && stateObj[key] && quick.every(function(p){ return p.name !== stateObj[key]; })){
      filterInput.value = stateObj[key]; // a previously written-in name that isn't a quick-pick chip
    }
    wrap.appendChild(filterInput);
    const fullWrap = document.createElement('div'); fullWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;';
    wrap.appendChild(fullWrap);
    function renderMatches(){
      const ft = filterInput.value.trim().toLowerCase();
      fullWrap.innerHTML = '';
      if (!ft) return;
      // Nathan: "it would be great to reference either the player # or the
      // name." Typing was already searching the combined "#5 Will J"
      // label, but that meant a plain "5" also matched #15, #25, #45,
      // #50... anyone with a 5 anywhere in their number. A purely numeric
      // query now matches jersey numbers that START WITH those digits
      // (so "5" narrows to 5, then "51" narrows further) instead of
      // matching loosely anywhere in the combined label; anything else is
      // still a normal name search.
      const isNumeric = /^\d+$/.test(ft);
      liveRoster.filter(function(p){
        return isNumeric ? String(p.num).indexOf(ft) === 0 : p.name.toLowerCase().indexOf(ft) !== -1;
      }).slice(0,14).forEach(function(p){
        const chip = document.createElement('div'); chip.className = 'optChip' + (selected().indexOf(p.name) !== -1 ? ' active' : '');
        chip.style.cssText = 'flex:0 0 auto;min-width:auto;padding:8px 12px;font-size:12px;';
        chip.textContent = playerLabel(p);
        chip.addEventListener('click', function(){ filterInput.value = ''; fullWrap.innerHTML = ''; togglePick(p.name); });
        fullWrap.appendChild(chip);
      });
    }
    filterInput.addEventListener('input', renderMatches);
    if (!multi){
      filterInput.addEventListener('blur', function(){ stateObj[key] = filterInput.value.trim() || null; });
      filterInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); stateObj[key] = filterInput.value.trim() || null; renderWizard(); } });
    } else {
      filterInput.placeholder = '🔍 Search, or type a name and press Enter…';
      filterInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); const v = filterInput.value.trim(); if (v) togglePick(v); filterInput.value = ''; fullWrap.innerHTML = ''; } });
    }
    function togglePick(name){
      if (multi){
        const arr = stateObj[key] || (stateObj[key] = []);
        const idx = arr.indexOf(name);
        if (idx === -1) arr.push(name); else arr.splice(idx,1);
      } else {
        stateObj[key] = name;
      }
      renderWizard();
    }
    container.appendChild(wrap);
  }
  function chipGroupField(container, label, stateObj, key, options, onSelect){

  function renderGameHeaderHtml(){
    const g = wiz.game;

      '<div><div style="font-size:9.5px;color:var(--dim2);text-transform:uppercase;">Down</div><div style="font-size:15px;font-weight:800;margin-top:2px;">' + ['1st','2nd','3rd','4th'][g.down-1] + '</div></div>' +

  }
  function quarterLbl(n){ return n <= 4 ? ('Q'+n) : ('OT'+(n-4)); }

  // ---- Spot/down-distance math -- ported from stat-keeper.html/game-playback.html ----
  function signedYardsFromSpots(startAbs, endAbs, isUsTeam){
    if (startAbs == null || endAbs == null) return 0;
    return isUsTeam ? (endAbs - startAbs) : (startAbs - endAbs);
  }
  function sideYardFromAbs(abs){ const y = Math.round(abs <= 50 ? abs : (100 - abs)); return { side: abs <= 50 ? 'OWN' : 'OPP', yard: y }; }

  // Nathan: "I want to use the wizard to watch the game back... with the
  // game film in the top of the screen and the wizard at the bottom." Uses
  // whatever's already linked under this game's own Game Footage (same
  // clips schedule.js's game detail page shows) -- YouTube and Google
  // Drive links get embedded directly since both support that; anything
  // else (Hudl, etc.) just gets a button, since most video hosts block
  // being embedded in someone else's page and there's no reliable way
  // around that. On a tablet, opening that link and using the OS's own
  // split-view alongside this page is the practical fallback there.
  // Nathan: "this whole feature isn't working well" -- the direct-video-
  // file technique (converting a Drive share link to a streamable file URL
  // for a native <video>) failed with a real "source not supported/
  // blocked" error, most likely Google Drive's own virus-scan/large-file
  // interstitial page coming back instead of actual video bytes when hit
  // this way. Back to the plain /preview embed Google's own viewer uses --
  // reliable, but no programmatic control, so filmTimestamp can't be
  // auto-captured for Drive-hosted footage (still works for YouTube).
  function embeddableFilmSrc(url){
    if (!url) return null;
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{6,})/);
    if (m) return { kind:'youtube', videoId: m[1] };
    m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m && /drive\.google\.com/.test(url)) return { kind:'drive', previewUrl: 'https://drive.google.com/file/d/' + m[1] + '/preview' };
    return null;
  }
  let filmPanelCollapsed = false;
  let filmClipIndex = 0;
  let filmPanelBuiltForGameId = null; // which game's film is currently sitting in #filmPanelHost
  let filmKind = null; // 'youtube' | 'drive' | null -- which control path getCurrentFilmTime/play-pause should use

  // Nathan: "Video is always visible in the top and should not start over
  // or reload when a play is saved." Builds the panel (and its <iframe>)
  // into #filmPanelHost exactly ONCE per game -- re-picking a different
  // clip or collapsing/expanding updates that same host in place rather
  // than tearing the iframe down, and switching between wizard steps just
  // shows/hides the host, never rebuilds it. That's the whole fix: nothing
  // about logging a play ever touches this host at all anymore.
  function ensureFilmPanelBuilt(){
    if (filmPanelBuiltForGameId === selectedGame.id) return;
    filmPanelBuiltForGameId = selectedGame.id;
    filmClipIndex = 0;
    renderFilmPanelContent();
  }
  // Nathan: "Give me the options of setting markers at the end of each
  // play so there is a link between the plays and the clip." Picked
  // option B (auto-capture) + C (auto-jump in Playback) -- this needs the
  // real YouTube IFrame API (not just fire-and-forget postMessage
  // commands like before), since reading the CURRENT time back out of the
  // player requires an actual player object, not just sending it
  // one-way instructions. Loaded once, reused by both the Wizard's own
  // capture and (mirrored) Playback's auto-seek.
  let ytApiLoadPromise = null;
  function ensureYouTubeApi(){
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytApiLoadPromise) return ytApiLoadPromise;
    ytApiLoadPromise = new Promise(function(resolve){
      const prevCallback = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function(){ if (prevCallback) prevCallback(); resolve(); };
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    });
    return ytApiLoadPromise;
  }
  let ytPlayer = null;
  function appendPlayPauseControls(wrap, onPlay, onPause){
    // Nathan: "I need a quick pause and play option on it... Needs to be
    // quick." Big, thumb-reachable buttons under the video -- faster to
    // hit mid-play-call than the tiny controls inside an embedded player,
    // especially one-handed. Same two buttons regardless of whether the
    // video underneath is a YouTube player object or a native <video>.
    const controls = document.createElement('div'); controls.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
    const playBtn = document.createElement('button'); playBtn.className = 'primaryBtn'; playBtn.style.margin = '0'; playBtn.textContent = '▶️ Play';
    playBtn.addEventListener('click', onPlay);
    const pauseBtn = document.createElement('button'); pauseBtn.className = 'primaryBtn'; pauseBtn.style.margin = '0'; pauseBtn.style.background = 'linear-gradient(135deg,#6b7480,#454c56)'; pauseBtn.textContent = '⏸ Pause';
    pauseBtn.addEventListener('click', onPause);
    controls.appendChild(playBtn); controls.appendChild(pauseBtn);
    wrap.appendChild(controls);
  }

  function renderFilmPanelContent(){

      if (!clips.length){
        const empty = document.createElement('div'); empty.className = 'sub'; empty.style.margin = '8px 0 0';

        wrap.appendChild(empty);
      } else {
