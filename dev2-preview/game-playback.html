<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASL Bengals — Game Playback</title>
<!--
  Nathan: "I would like the kids to be able to call back a log of the game
  like you can watch back a baseball logged game in gamechanger... it
  would show the progression on the field like the [ESPN gamecast]
  example." And: "someone is not there to log the game live so it would be
  something that would be generated as a playback feature post game along
  with the review."

  This is a read-only companion to stat-keeper.html: it doesn't log
  anything, it replays a game that's ALREADY been logged there (live or
  reconstructed after the fact from film) into a real field-position
  viewer -- ball marker, down & distance, score, play-by-play -- one play
  at a time or auto-playing like a highlight reel.

  It only works well for plays that carry real spot data, which is
  everything logged going forward now that Stat Keeper stamps a spot on
  every play type. Older games logged before that will have real gaps
  (Kickoff/Punt/Tackle already had spots earlier; Run/Pass/Kneel/Penalty/
  Defensive Extra/Turnover/Score did not) -- those plays just show up as a
  play description with no ball movement, same graceful "nothing to show"
  handling the log's own spot badges already use.

  Nathan also floated feeding this same structured play log into AI game
  write-ups/previews -- that's a genuinely good next step (this is exactly
  the kind of structured, chronological data that makes for a much better
  prompt than a final score line), but it's a separate feature built on
  TOP of this one, not part of it. Once a few games have a full play-by-
  play like this, generating a real recap becomes a matter of handing that
  data to Claude with a prompt, either here or back in schedule.js where
  "Game Recap" already lives.

  Duplicates rather than imports from stat-keeper.html/schedule.js/
  standings.js, same reason those duplicate from each other: this project
  has no build step or shared module system, so each standalone HTML file
  carries its own copy of whatever helpers it needs. If the simulation
  logic in stat-keeper.html's advanceSpotForPlay/advanceDownDistanceForPlay
  ever changes, port the change here too so a replay doesn't quietly
  drift out of sync with what Stat Keeper itself would show.
-->
<style>
  :root{ --console:#1b1f26; --line-bright:#2c333d; --dim:#9aa4ae; --dim2:#6b7480; --cyan:#3ddcff; --orange:#ff8a3d; --field:#1e5c2e; --bengal-orange:#ff6a13; }
  *{box-sizing:border-box}
  body{margin:0;background:#0b0e13;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:40px}
  .topBar{padding:14px 16px 10px;border-bottom:1px solid var(--line-bright);position:sticky;top:0;background:#0b0e13;z-index:5}
  .topBar h1{margin:0 0 10px;font-size:15px;font-weight:800;letter-spacing:.02em}
  select#gameSelect{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line-bright);background:var(--console);color:#fff;font-size:14px}
  #loadStatus{font-size:11px;color:var(--dim2);margin-top:6px;text-align:center;min-height:14px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  .scoreBug{display:flex;align-items:center;justify-content:space-between;background:var(--console);border:1px solid var(--line-bright);border-radius:12px;padding:12px 16px;margin:14px 0}
  .scoreBug .teamSide{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--dim)}
  .scoreBug .teamSide.opp{flex-direction:row-reverse}
  .scoreBug .teamLogo{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#0000;flex:0 0 auto}
  .scoreBug .teamLogo.fallback{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
  .scoreBug .pts{font-size:26px;font-weight:900;color:#fff}
  .scoreBug .mid{font-size:11px;color:var(--dim2);text-align:center;padding:0 8px}
  .ddPanel{display:flex;justify-content:space-around;background:var(--console);border:1px solid var(--line-bright);border-radius:12px;padding:10px;margin-bottom:12px;text-align:center}
  .ddPanel .k{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
  .ddPanel .v{font-size:15px;font-weight:800;margin-top:2px}
  /* Nathan (follow-up, after several rounds trying to make a tilted 3D
     field work): "this style and progression is way cleaner and more
     simplified" -- pointing at the plain ESPN Gamecast drive widget: a
     flat field bar, solid-color end zones, a soft translucent team-logo
     "ghost" behind a small precise ball marker, yard numbers in one row
     underneath instead of painted on the turf. Dropping the 3D
     perspective entirely and rebuilding flat, matching that reference
     directly instead of continuing to iterate on an approach that kept
     introducing new problems (warped goal posts, lines running past the
     turf, numbers in the wrong spot) each round. */
  .fieldOuter{position:relative;margin-bottom:6px}
  .fieldWrap{position:relative;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line-bright);
    background:repeating-linear-gradient(90deg, var(--field) 0, var(--field) 9.09%, #256b31 9.09%, #256b31 18.18%)}
  .endzoneOwn,.endzoneOpp{position:absolute;top:0;bottom:0;width:9.09%}
  .endzoneOwn{left:0} .endzoneOpp{right:0}
  .fieldNumRow{position:relative;height:16px;margin-top:4px}
  .fieldNumRow span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--dim2)}
  .fieldNumRow span.endLabel{font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
  /* Nathan (earlier): "The 10 is on the goal line - should be much more
     accurate." Each number gets its own exact left:X% computed from the
     real 81.82%-wide playing field between the two goal lines (10 yards
     in from the line, not on it) -- unchanged by the flat rebuild, this
     part was already correct. */
  .ballGhost{position:absolute;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);transition:left .5s ease;z-index:2;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.55}
  .ballMarker{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;transition:left .5s ease;font-size:15px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));z-index:3}
  .firstDownLine{position:absolute;top:0;bottom:0;width:2px;background:#ffe14d;opacity:.85;transition:left .5s ease;z-index:2}
  /* Nathan: "Lines on the field should show the original line of
     scrimmage, the current line of the ball, and the 1st down marker."
     Three distinct reference lines, same broadcast-graphic idea as a real
     game: LOS (where this play started -- dashed so it doesn't compete
     visually with the two solid lines), current ball spot (where it
     ended up -- reinforces the ball marker sitting right on top of it),
     first down (unchanged, yellow). */
  .losLine{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(255,255,255,.75);opacity:.9;transition:left .5s ease;z-index:2}
  .currentLine{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);opacity:.85;transition:left .5s ease;z-index:2}
  .fieldLegend{display:flex;gap:14px;justify-content:center;font-size:9.5px;color:var(--dim2);margin:-4px 0 12px}
  .fieldLegend span{display:flex;align-items:center;gap:4px}
  .fieldLegend i{display:inline-block;width:10px;height:2px}
  /* Nathan: "When touchdowns are scored there should be more notification
     that it's a score." A full-width animated banner that only appears on
     a step where that play actually scored a TD -- punchier than the
     small "🏆 Touchdown" text already in the play description, meant to
     be seen even if you're glancing at the film, not reading every word. */
  .tdBanner{display:none;text-align:center;font-size:22px;font-weight:900;letter-spacing:.04em;color:#111;background:linear-gradient(135deg,#ffe14d,#ff8a3d);border-radius:12px;padding:10px;margin-bottom:12px;text-transform:uppercase;animation:tdPop .5s cubic-bezier(.34,1.56,.64,1)}
  .tdBanner.show{display:block}
  @keyframes tdPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  .boxScore{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
  .boxScore th,.boxScore td{padding:5px 6px;text-align:center;color:var(--dim)}
  .boxScore th{color:var(--dim2);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.04em;border-bottom:1px solid var(--line-bright)}
  .boxScore td.teamCell{text-align:left;font-weight:800;color:#fff}
  .boxScore td.totalCell{font-weight:900;color:var(--cyan)}
  .playCard{background:var(--console);border:1px solid var(--line-bright);border-radius:12px;padding:14px;margin-bottom:14px;min-height:70px}
  .playCard .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
  .playCard .tag.off{color:var(--cyan)} .playCard .tag.def{color:var(--orange)}
  .playCard .spotTag{color:#ffe14d} .playCard .dndTag{color:#8ab4f8}
  .playCard .desc{font-size:14px;line-height:1.5;margin-top:6px}
  .stepMeta{font-size:11px;color:var(--dim2);margin-bottom:4px}
  .controls{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .ctrlBtn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line-bright);background:var(--console);color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer}
  .ctrlBtn:active{filter:brightness(1.2)}
  .ctrlBtn[disabled]{opacity:.35;pointer-events:none}
  .ctrlBtn.primary{background:linear-gradient(135deg,#ff8a3d,#e0570a);border-color:transparent}
  .scrubRow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .scrubRow input[type=range]{flex:1}
  .scrubLabel{font-size:11px;color:var(--dim2);white-space:nowrap;min-width:64px;text-align:right}
  .speedRow{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
  .speedChip{padding:6px 12px;border-radius:20px;border:1px solid var(--line-bright);font-size:11px;color:var(--dim);cursor:pointer}
  .speedChip.active{background:var(--cyan);color:#04222b;border-color:var(--cyan);font-weight:800}
  .emptyState{text-align:center;color:var(--dim2);padding:40px 20px;font-size:13px}
  .quarterDivider{text-align:center;color:var(--dim2);font-size:11px;font-weight:800;letter-spacing:.08em;margin:10px 0;text-transform:uppercase}
</style>
</head>
<body>
<div class="topBar">
  <div class="wrap">
    <h1>🎬 Game Playback</h1>
    <select id="gameSelect"><option value="">— Sign in to load games —</option></select>
    <div id="loadStatus"></div>
  </div>
</div>

<div class="wrap" id="viewerWrap" style="display:none;">
  <!-- Nathan: "Give me the options of setting markers at the end of each
       play so there is a link between the plays and the clip so we could
       show the clip along with the field graphic in playback mode." Sits
       above the field, same "video always on top" layout as the Wizard --
       stepping through plays auto-seeks this to whatever moment that play
       was logged at (see renderStep's use of ytPlayer.seekTo). -->
  <div id="filmPanelHost"></div>
  <div class="scoreBug">
    <div class="teamSide us">
      <img class="teamLogo" id="usLogo" src="assets/images/header-logo.png" alt="ASL Bengals">
      <div class="pts" id="scoreUs">0</div>
    </div>
    <div class="mid" id="quarterLabel">—</div>
    <div class="teamSide opp">
      <div class="teamLogo" id="oppLogo"></div>
      <div class="pts" id="scoreOpp">0</div>
    </div>
  </div>

  <div class="ddPanel">
    <div><div class="k">Down</div><div class="v" id="ddDown">—</div></div>
    <div><div class="k">Ball On</div><div class="v" id="ddSpot">—</div></div>
    <div><div class="k">Distance</div><div class="v" id="ddDist">—</div></div>
  </div>

  <div class="tdBanner" id="tdBanner">🏆 TOUCHDOWN!</div>

  <div class="fieldOuter">
    <div class="fieldWrap" id="fieldWrap">
      <div class="endzoneOwn" id="endzoneOwn"></div>
      <div class="endzoneOpp" id="endzoneOpp"></div>
      <div class="losLine" id="losLine" style="display:none;"></div>
      <div class="currentLine" id="currentLine" style="display:none;"></div>
      <div class="firstDownLine" id="firstDownLine" style="display:none;"></div>
      <div class="ballGhost" id="ballGhost"></div>
      <div class="ballMarker" id="ballMarker">🏈</div>
    </div>
    <div class="fieldNumRow" id="fieldNumRow">
      <span class="endLabel" id="endzoneOwnLabel" style="left:4.545%;">BEN</span>
      <span style="left:17.27%;">10</span><span style="left:25.45%;">20</span><span style="left:33.64%;">30</span><span style="left:41.82%;">40</span><span style="left:50%;">50</span><span style="left:58.18%;">40</span><span style="left:66.36%;">30</span><span style="left:74.55%;">20</span><span style="left:82.73%;">10</span>
      <span class="endLabel" id="endzoneOppLabel" style="left:95.455%;">OPP</span>
    </div>
  </div>
  <div class="fieldLegend">
    <span><i style="border-top:2px dashed rgba(255,255,255,.75);background:none;"></i> Line of scrimmage</span>
    <span><i style="background:var(--cyan);"></i> Current spot</span>
    <span><i style="background:#ffe14d;"></i> 1st down</span>
  </div>

  <div class="playCard">
    <div class="stepMeta" id="stepMeta">—</div>
    <div id="playTagsLine"></div>
    <div class="desc" id="playDesc">Press ▶ Play or step through with the arrows below.</div>
    <!-- Nathan: "Box score should be under the play description." -->
    <table class="boxScore" id="boxScore"><tbody></tbody></table>
  </div>

  <div class="scrubRow">
    <span class="scrubLabel" id="scrubLabel">0 / 0</span>
    <input type="range" id="scrubSlider" min="0" max="0" value="0" step="1">
  </div>

  <div class="controls">
    <div class="ctrlBtn" id="prevBtn">⏮ Prev</div>
    <div class="ctrlBtn primary" id="playPauseBtn">▶ Play</div>
    <div class="ctrlBtn" id="nextBtn">Next ⏭</div>
  </div>
  <div class="speedRow">
    <div class="speedChip" data-ms="3500">Slow</div>
    <div class="speedChip active" data-ms="2200">Normal</div>
    <div class="speedChip" data-ms="1200">Fast</div>
  </div>
</div>

<div class="wrap" id="emptyWrap"><div class="emptyState">Pick a game above to watch its play-by-play back.</div></div>

<script>
(function(){
  // ---------------------------------------------------------------------
  // Ported verbatim from dev2/stat-keeper.html -- see this file's own
  // top-of-file comment for why duplication (not import) is correct here.
  // ---------------------------------------------------------------------
  const FIREBASE_DB_URL = 'https://aslbengals-default-rtdb.firebaseio.com';
  const FIREBASE_API_KEY = 'AIzaSyCBvobt9qfyLoJOGUz6fIiGrFKMEQFsA3E'; // public project identifier, not a secret
  const COACH_CODE_HASH = 'fde7fd37696f9bc49c1e13a1dae70923a5ef1dec148e1ce16d5136519dac162d';
  const SIGNUP_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`;
  const SIGNIN_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`;
  const REFRESH_URL = `https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`;
  const GATE_SESSION_KEY = 'bengalsGateSession';
  const SAFETY_MARGIN_MS = 60000;
  let authCache = null;
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function loadGateSession(){ try { return JSON.parse(localStorage.getItem(GATE_SESSION_KEY) || 'null'); } catch(e){ return null; } }
  function saveGateSession(refreshToken){ try { localStorage.setItem(GATE_SESSION_KEY, JSON.stringify({refreshToken, kind:'coach'})); } catch(e){} }
  function hasGateSession(){ const s = loadGateSession(); return !!(s && s.refreshToken); }
  async function refreshIdToken(refreshToken){
    const res = await fetch(REFRESH_URL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}` });
    if (!res.ok) throw new Error('Token refresh failed: HTTP ' + res.status);
    const data = await res.json();
    return { idToken: data.id_token, refreshToken: data.refresh_token, expiresAt: Date.now() + Number(data.expires_in)*1000 };
  }
  async function signInWithCoachGate(passwordHash){
    const email = 'coach-gate@aslbengals.internal';
    let res = await fetch(SIGNUP_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: passwordHash, returnSecureToken: true }) });
    if (!res.ok){
      const errBody = await res.json().catch(() => ({}));
      const code = errBody.error && errBody.error.message;
      if (code === 'EMAIL_EXISTS'){
        res = await fetch(SIGNIN_URL, { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password: passwordHash, returnSecureToken: true }) });
        if (!res.ok) throw new Error('Gate sign-in failed: HTTP ' + res.status);
      } else { throw new Error('Gate account setup failed: ' + (code || res.status)); }
    }
    const data = await res.json();
    authCache = { idToken: data.idToken, refreshToken: data.refreshToken, expiresAt: Date.now() + Number(data.expiresIn)*1000 };
    saveGateSession(authCache.refreshToken);
    return authCache;
  }
  async function getFirebaseIdToken(){
    if (authCache && authCache.expiresAt - SAFETY_MARGIN_MS > Date.now()) return authCache.idToken;
    if (authCache && authCache.refreshToken){ authCache = await refreshIdToken(authCache.refreshToken); saveGateSession(authCache.refreshToken); return authCache.idToken; }
    const saved = loadGateSession();
    if (saved && saved.refreshToken){ authCache = await refreshIdToken(saved.refreshToken); saveGateSession(authCache.refreshToken); return authCache.idToken; }
    throw new Error('Not signed in');
  }
  async function firebaseAuthedUrl(url){
    const token = await getFirebaseIdToken();
    const sep = url.indexOf('?') === -1 ? '?' : '&';
    return `${url}${sep}auth=${encodeURIComponent(token)}`;
  }
  // Nathan: "I would like the kids to be able to call back a log of the
  // game" -- this reuses the same coach-gate sign-in as Stat Keeper for
  // now (simplest way to get a valid Firebase read token today), so in
  // practice this is a "coach pulls it up and the team watches together"
  // experience rather than every player signing in on their own device.
  // Wiring this into the players' OWN existing login (see
  // player-identity.js) instead is the natural next step once there are
  // real games worth replaying -- flagged here rather than guessed at,
  // since that's a different auth system this file has no visibility into.
  async function ensureViewerAuth(){
    if (hasGateSession()){ try { await getFirebaseIdToken(); return true; } catch(e){} }
    let code = null;
    try { code = prompt('Enter the coach code to load game logs:'); } catch(e){ return false; }
    if (!code) return false;
    const hash = await sha256Hex(code);
    if (hash !== COACH_CODE_HASH){ alert('Incorrect code.'); return false; }
    try { await signInWithCoachGate(hash); return true; } catch(e){ alert("Couldn't sign in: " + e.message); return false; }
  }

  // ---- Spot/score math -- verbatim port from stat-keeper.html ----
  function absoluteSpot(side, yard){
    if (!side || yard === '' || yard == null) return null;
    const y = Number(yard);
    if (isNaN(y)) return null;
    return side === 'OWN' ? y : (100 - y);
  }
  function spotLabel(side, yard){ if (!side || yard === '' || yard == null) return ''; return side + ' ' + yard; }
  function spotLabelAbs(spot){
    const y = Math.round(spot <= 50 ? spot : (100 - spot));
    if (Math.round(spot) === 50) return 'Midfield (the 50)';
    return (spot <= 50 ? 'OWN ' : 'OPP ') + y;
  }
  function sideYardFromAbs(abs){ const y = Math.round(abs <= 50 ? abs : (100 - abs)); return { side: abs <= 50 ? 'OWN' : 'OPP', yard: y }; }
  function signedYardsFromSpots(startAbs, endAbs, isUsTeam){
    if (startAbs == null || endAbs == null) return 0;
    return isUsTeam ? (endAbs - startAbs) : (startAbs - endAbs);
  }
  function clampSpot(v){ return Math.max(0, Math.min(100, v)); }
  function asList(v){ if (Array.isArray(v)) return v.filter(Boolean); return v ? [v] : []; }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function quarterLabel(n){ return n <= 4 ? ('Q'+n) : ('OT'+(n-4)); }

  // ---- Team identity (logo/color/abbreviation) -- ported from
  // schedule.js's own badge system so a game here looks like the same
  // team the rest of the app already knows, not a re-invented one. ----
  const BUNDLED_LOGOS = {
    clinton: 'assets/images/opponents/clinton.png',
    leominster: 'assets/images/opponents/leominster.png',
    leicesterspencer: 'assets/images/opponents/leicesterspencer.png',
  };
  let opponentLogos = {};
  function normalizeOpponentKey(name){
    const cleaned = (name || '').replace(/\(.*?\)/g, '').trim();
    const firstWord = cleaned.split(/\s+/).filter(Boolean)[0] || '';
    return firstWord.toLowerCase().replace(/[^a-z0-9]/g, '');
  }
  function hashColor(str){
    let hash = 0;
    for (let i = 0; i < (str || '').length; i++) hash = (hash * 31 + str.charCodeAt(i)) | 0;
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 55%, 32%)`;
  }
  function opponentAbbrev(name){
    const cleaned = (name || '').replace(/\(.*?\)/g, '').trim();
    const firstWord = (cleaned.split(/\s+/).filter(Boolean)[0] || 'OPP').replace(/[^a-zA-Z]/g, '');
    return (firstWord.slice(0,3) || 'OPP').toUpperCase();
  }
  function opponentLogoSrc(name){
    const key = normalizeOpponentKey(name);
    return opponentLogos[key] || BUNDLED_LOGOS[key] || null;
  }
  // Nathan: "Have colors of the endzone be the team color... Team logos
  // should be used in the header and scores." Applies whatever's known
  // about the opponent (real logo if one's on file, otherwise the same
  // deterministic hashColor the rest of the app already falls back to) to
  // both the score bug and the end zone -- called once per game load,
  // not per play, since none of this changes during a single game.
  let currentOppAbbrev = 'OPP'; // used by the box score column header -- kept separate from the endzone's own (now full-name) text so reading it back doesn't concatenate the ghost + label spans together
  // Nathan: "Give me the options of setting markers at the end of each
  // play so there is a link between the plays and the clip." Same real
  // YouTube IFrame API approach as game-wizard.html (needed so renderStep
  // below can call ytPlayer.seekTo -- a plain iframe can't be driven like
  // that), ported rather than shared since these are separate standalone
  // pages with no shared module system between them.
  let ytApiLoadPromise = null;
  function ensureYouTubeApi(){
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytApiLoadPromise) return ytApiLoadPromise;
    ytApiLoadPromise = new Promise(function(resolve){
      const prevCallback = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function(){ if (prevCallback) prevCallback(); resolve(); };
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    });
    return ytApiLoadPromise;
  }

  function embeddableFilmSrc(url){

    if (m) return { kind:'youtube', videoId: m[1] };
    m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    return null;

  function describePlay(p){
    if (p.type==='run'){

        (p.firstDown?' · 1st down':'') + (p.td?' · TD':'') + (p.oob?' · out of bounds':'') + (isUsPass ? formationTxt(p) + playRunTxt(p) + coachFormationTxt(p) + coachCallTxt(p) : tackleTxt(p));

    if (p.type==='kick'){

        if (p.recoveredByTeam==='Us' && p.returner) base += ', ' + p.returner + ' brought it ' + (p.yards||0) + ' yds';
        return base;
      }
      const catchTxt = spotLabel(p.catchSide, p.catchYard);
      const returnerTxt = isUsKick ? ('Opponent' + (p.oppReturner ? ' ('+p.oppReturner+')' : '')) : (p.returner||'?');
      const startAbs = absoluteSpot(p.startSide, p.startYard), catchAbs = absoluteSpot(p.catchSide, p.catchYard), endAbs = absoluteSpot(p.endSide, p.endYard);
      const kickDist = (startAbs != null && catchAbs != null) ? (isUsKick ? (catchAbs - startAbs) : (startAbs - catchAbs)) : null;
      const retYds = (catchAbs != null && endAbs != null) ? (isUsKick ? (catchAbs - endAbs) : (endAbs - catchAbs)) : null;
      let base = (isUsKick ? '' : '🛡️ ') + 'Kickoff (' + (isUsKick?'Us':'Opponent') + ')' + ', returned by ' + returnerTxt;
      if (catchTxt) base += ', caught at '+catchTxt;
      if (p.td) base += ' · 🏆 TD';
      if (kickDist != null) base += ' · '+kickDist+' yd kick';
      if (retYds != null) base += ' · '+retYds+' return yds';

      const net = (startAbs != null && endAbs != null) ? (isUs ? (endAbs - startAbs) : (startAbs - endAbs)) : null;
      const puntDist = (startAbs != null && catchAbs != null) ? (isUs ? (catchAbs - startAbs) : (startAbs - catchAbs)) : null;
      const retYds = (catchAbs != null && endAbs != null) ? (isUs ? (catchAbs - endAbs) : (endAbs - catchAbs)) : null;
      const puntGloss = isUs ? (p.punter||'?') : ('Opponent' + (p.oppPunter ? ' ('+p.oppPunter+')' : ''));

        if (p.td) base += ' · 🏆 TD';

      return (isUsKneel ? '' : '🛡️ ') + '🕐 ' + (p.kneelType||'Kneel') + qbTxt + lossTxt;

        : 'Tackle — ' + (p.tackler||'?') + (assists.length ? ' + '+assists.join(' + ')+' (assist)' : ' (solo)');
      if (p.startSide != null && p.endSide != null){

      const ydsTxt = p.declined ? 'declined' : (p.penYards||0)+' yds';
      return '🚩 ' + penName + ' on ' + (p.penTeam||'?') + (p.penPlayer ? ' ('+p.penPlayer+')' : '') +

  function advanceSpotForPlay(state, entry){
    let currentSpot = state.spot;
    if (entry.type === 'run'){
      currentSpot = clampSpot(currentSpot + (entry.runTeam !== 'Opponent' ? Number(entry.yards||0) : -Number(entry.yards||0)));
    } else if (entry.type === 'pass' && entry.result === 'Complete'){
      currentSpot = clampSpot(currentSpot + (entry.passTeam !== 'Opponent' ? Number(entry.yards||0) : -Number(entry.yards||0)));
    } else if (entry.type === 'kick'){
      if (entry.onside){
        if (entry.recoveredByTeam === 'Us' && Number(entry.yards||0)) currentSpot = clampSpot(currentSpot + Number(entry.yards||0));
      } else {
        const endAbs = absoluteSpot(entry.endSide, entry.endYard);
        if (endAbs != null) currentSpot = clampSpot(endAbs);
      }
    } else if (entry.type === 'punt'){
      const endAbs = absoluteSpot(entry.endSide, entry.endYard);
      if (endAbs != null) currentSpot = clampSpot(endAbs);
    } else if (entry.type === 'kneel' && entry.kneelType !== 'Spike'){
      const baseAbs = absoluteSpot(entry.spotSide, entry.spotYard);
      const base = baseAbs != null ? baseAbs : currentSpot;
      const loss = Number(entry.kneelYards || 0);
      currentSpot = clampSpot(base + (entry.kneelTeam !== 'Opponent' ? -loss : loss));
    } else if (entry.type === 'tackle'){
      const endAbs = absoluteSpot(entry.endSide, entry.endYard);
      if (endAbs != null) currentSpot = clampSpot(endAbs);
    } else if (entry.type === 'penalty' && !entry.declined){
      const baseAbs = absoluteSpot(entry.spotSide, entry.spotYard);
      const base = baseAbs != null ? baseAbs : currentSpot;
      const yds = Number(entry.penYards || 0);
      currentSpot = clampSpot(base + (entry.penTeam === 'Us' ? -yds : yds));
    } else if (entry.type === 'defextra'){
      const spotAbs = absoluteSpot(entry.spotSide, entry.spotYard);
      if (spotAbs != null) currentSpot = clampSpot(spotAbs);
    } else if (entry.type === 'turnover'){
      // Nathan: same catchSide/endSide fix as stat-keeper.html and
      // game-wizard.html -- the replay simulation needs to advance the
      // ball to where the return ENDED, not just where it was caught.
      const endAbs = absoluteSpot(entry.endSide, entry.endYard);
      const legacyAbs = absoluteSpot(entry.spotSide, entry.spotYard);
      const spotAbs = endAbs != null ? endAbs : legacyAbs;
      if (spotAbs != null) currentSpot = clampSpot(spotAbs);
    }
    state.spot = currentSpot;
  }
  function advanceDownDistanceForPlay(state, entry){
    function yardsAndDirFor(e){
      if (e.type === 'run') return { yards: Number(e.yards||0), forward100: e.runTeam !== 'Opponent' };
      if (e.type === 'pass' && e.result === 'Complete') return { yards: Number(e.yards||0), forward100: e.passTeam !== 'Opponent' };
      if (e.type === 'tackle'){
        const startAbs = absoluteSpot(e.startSide, e.startYard), endAbs = absoluteSpot(e.endSide, e.endYard);
        return { yards: signedYardsFromSpots(startAbs, endAbs, false), forward100: false };
      }
      if (e.type === 'kneel' && e.kneelType !== 'Spike') return { yards: -Number(e.kneelYards||0), forward100: e.kneelTeam !== 'Opponent' };
      return null;
    }
    const info = yardsAndDirFor(entry);
    if (info){
      const distToGoal = info.forward100 ? (100 - state.spot) : state.spot;
      if (entry.firstDown || info.yards >= state.distance){
        state.down = 1; state.distance = Math.max(1, Math.min(10, distToGoal));
      } else {
        state.down = Math.min(4, state.down + 1);
        state.distance = Math.max(1, state.distance - info.yards);
      }
    } else if ((entry.type === 'pass' && entry.result === 'Incomplete') || (entry.type === 'kneel' && entry.kneelType === 'Spike')){
      state.down = Math.min(4, state.down + 1);
    } else if ((entry.type === 'kick' && !entry.onside) || entry.type === 'punt' || entry.type === 'turnover' ||
               (entry.type === 'defextra' && entry.extraType === 'INT')){
      state.down = 1; state.distance = 10;
    } else if (entry.type === 'score'){
      state.down = 1; state.distance = 10;
    } else if (entry.type === 'penalty' && entry.firstDown && !entry.declined){
      state.down = 1; state.distance = 10;
    }
  }
  function scoreDeltaFor(p){
    let us = 0, opp = 0;
    if (p.type === 'score'){
      const forUs = p.scoreTeam !== 'Opponent';
      let pts = 0;
      // Nathan: "at this level - a kick is worth 2 points and a play for
      // a score is worth 1 point." Matches both the corrected label and
      // the old one, same backward-compatible approach as stat-keeper.html.
      if (p.scoreKind === 'Kick (2 pt Good)' || p.scoreKind === '2PT Good') pts = 2;
      else if (p.scoreKind === 'Run/Pass Play (1 pt Good)' || p.scoreKind === 'PAT Good') pts = 1;
      else if (p.scoreKind === 'Safety') pts = 2;
      if (forUs) us += pts; else opp += pts;
      return { us, opp };
    }
    if (!p.td) return { us, opp };
    if (p.type === 'run'){ if (p.runTeam !== 'Opponent') us += 6; else opp += 6; }
    else if (p.type === 'pass'){ if (p.passTeam !== 'Opponent') us += 6; else opp += 6; }
    else if (p.type === 'kick' && !p.onside){ us += 6; }
    else if (p.type === 'punt'){ if (p.puntTeam !== 'Opponent') opp += 6; else us += 6; }
    else if (p.type === 'defextra'){ us += 6; }
    return { us, opp };
  }

  // Nathan: "work through the setup and playback of the starting
  // sequence." Simulates the WHOLE game forward once, from opening
  // kickoff conditions (50-yard line, 1st & 10, 0-0), recording the
  // before/after state at every real play (quarter-end markers are kept
  // as dividers but don't get their own step) -- this is what actually
  // makes "step back and forth through the game" possible, since a stored
  // play only ever recorded ITS OWN moment, never the full runing state
  // in between.
  function buildTimeline(plays){
    // Nathan (follow-up): "play 57/57 is the first play of the game
    // appearing at the end of the timeline." Confirmed by direct testing
    // that plays are now genuinely stored chronologically (oldest first)
    // -- insertPlay's default was fixed to plays.push (append) rather
    // than plays.unshift (prepend) specifically because that's what
    // renderLog() already assumed and what the Wizard's own commit
    // functions already do. This reversal was correct back when Stat
    // Keeper's OWN entry form defaulted to prepending new plays -- once
    // that changed, reversing already-chronological data just flips the
    // whole game backwards, which is exactly what this screenshot shows.
    const ordered = (plays || []).slice();
    const state = { spot: 50, down: 1, distance: 10, us: 0, opp: 0, quarter: 1 };
    const steps = [];
    ordered.forEach(function(p){
      if (p.type === 'quarterEnd'){ state.quarter = p.quarter + 1; return; }
      const before = { spot: state.spot, down: state.down, distance: state.distance, us: state.us, opp: state.opp, quarter: state.quarter };
      advanceSpotForPlay(state, p);
      advanceDownDistanceForPlay(state, p);
      const delta = scoreDeltaFor(p);
      state.us += delta.us; state.opp += delta.opp;
      steps.push({ play: p, before: before, after: { spot: state.spot, down: state.down, distance: state.distance, us: state.us, opp: state.opp, quarter: state.quarter } });
    });
    return steps;
  }

  // ---- Game selection ----
  const gameSelect = document.getElementById('gameSelect');
  const loadStatus = document.getElementById('loadStatus');
  const viewerWrap = document.getElementById('viewerWrap');
  const emptyWrap = document.getElementById('emptyWrap');
  let liveGamesCache = [];
  let timeline = [];
  let stepIndex = -1; // -1 = pre-game (opening kickoff not yet shown)
  let playTimer = null;
  let playSpeedMs = 2200;

  function populateGameSelect(){
    gameSelect.innerHTML = '';
    const topOpt = document.createElement('option'); topOpt.value=''; topOpt.textContent='— Select a game —';
    gameSelect.appendChild(topOpt);
    liveGamesCache.slice().sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999')).forEach(function(g){
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = (g.homeAway === 'Away' ? '@ ' : 'vs ') + (g.opponent || 'TBD') + (g.date ? ' — ' + g.date : '');
      gameSelect.appendChild(opt);
    });
  }

  async function loadGame(gameId){
    stopPlaying();
    if (!gameId){ viewerWrap.style.display='none'; emptyWrap.style.display=''; return; }
    const game = liveGamesCache.find(function(g){ return g.id === gameId; });
    applyOpponentIdentity(game);
    renderPlaybackFilmPanel(game);
    loadStatus.textContent = 'Loading this game\'s log…';
    let gs = null;
    try {
      const url = await firebaseAuthedUrl(FIREBASE_DB_URL + '/statKeeperLogs/' + gameId + '.json');
      const res = await fetch(url);
      if (res.ok) gs = await res.json();
    } catch(e){ loadStatus.textContent = '⚠️ Could not load this game: ' + e.message; return; }
    const plays = (gs && Array.isArray(gs.plays)) ? gs.plays : [];
    const realPlays = plays.filter(function(p){ return p.type !== 'quarterEnd'; });
    if (!realPlays.length){
      loadStatus.textContent = 'This game has no logged plays yet — nothing to play back.';
      viewerWrap.style.display = 'none'; emptyWrap.style.display = '';
      return;
    }
    timeline = buildTimeline(plays);
    stepIndex = -1;
    loadStatus.textContent = timeline.length + ' plays loaded.';
    viewerWrap.style.display = ''; emptyWrap.style.display = 'none';
    document.getElementById('scrubSlider').max = String(timeline.length - 1);
    renderStep();
  }

  gameSelect.addEventListener('change', function(){ loadGame(gameSelect.value); });

  // ---- Rendering ----
  const ballMarker = document.getElementById('ballMarker');
  const ballGhost = document.getElementById('ballGhost');
  const firstDownLine = document.getElementById('firstDownLine');
  const losLine = document.getElementById('losLine');
  const currentLine = document.getElementById('currentLine');
  function leftPctFor(spot){ return 9.09 + (spot/100)*(100-2*9.09); } // field graphic reserves 9.09% on each side for the end zones

  // Nathan (follow-up): "green and red arrows on the Game Playback is
  // hideous." Removed rather than re-guessed at a different style --
  // the field itself (spot badges, down/distance, the LOS/Current/1st-down
  // lines) already conveys where a play started and ended without needing
  // a separate arrow overlay, and repeatedly tuning a purely aesthetic
  // element I can't actually see render isn't a good use of more guesses.

  // Nathan: "Box score should be under the play description." Recomputed
  // fresh on every step from the timeline up to (and including) the
  // current play rather than stored per-step -- the game's only a
  // hundred-some plays at most, so re-summing is cheap, and it keeps this
  // as the single source of truth rather than a second running tally that
  // could drift from it.
  function renderBoxScore(uptoIndex){
    const table = document.getElementById('boxScore');
    if (uptoIndex < 0){ table.innerHTML = ''; return; }
    const quarterTotals = {};
    let maxQ = 1;
    for (let i = 0; i <= uptoIndex; i++){
      const step = timeline[i];
      const q = step.after.quarter;
      maxQ = Math.max(maxQ, q);
      if (!quarterTotals[q]) quarterTotals[q] = { us:0, opp:0 };
      const delta = scoreDeltaFor(step.play);
      quarterTotals[q].us += delta.us;
      quarterTotals[q].opp += delta.opp;
    }
    const numCols = Math.max(4, maxQ);
    let head = '<tr><th></th>';
    for (let q=1; q<=numCols; q++) head += '<th>'+quarterLabel(q)+'</th>';
    head += '<th>T</th></tr>';
    function row(label, key){
      let cells = '<td class="teamCell">'+escapeHtml(label)+'</td>', total = 0;
      for (let q=1; q<=numCols; q++){
        const v = (quarterTotals[q] && quarterTotals[q][key]) || 0;
        total += v;
        cells += '<td>'+(q<=maxQ ? v : '')+'</td>';
      }
      cells += '<td class="totalCell">'+total+'</td>';
      return '<tr>'+cells+'</tr>';
    }
    const oppAbbrev = currentOppAbbrev;
    table.innerHTML = '<thead>'+head+'</thead><tbody>'+row('Bengals','us')+row(oppAbbrev,'opp')+'</tbody>';
  }

  function renderStep(){
    const scrub = document.getElementById('scrubSlider');
    scrub.value = String(Math.max(0, stepIndex));
    document.getElementById('scrubLabel').textContent = (stepIndex+1) + ' / ' + timeline.length;
    document.getElementById('prevBtn').toggleAttribute('disabled', stepIndex <= 0);
    document.getElementById('nextBtn').toggleAttribute('disabled', stepIndex >= timeline.length - 1);

    if (stepIndex < 0){
      document.getElementById('scoreUs').textContent = '0';
      document.getElementById('scoreOpp').textContent = '0';
      document.getElementById('quarterLabel').textContent = 'Kickoff';
      document.getElementById('ddDown').textContent = '—';
      document.getElementById('ddSpot').textContent = 'OWN 50';
      document.getElementById('ddDist').textContent = '—';
      document.getElementById('stepMeta').textContent = 'Before the opening kickoff';
      document.getElementById('playTagsLine').innerHTML = '';
      document.getElementById('playDesc').textContent = 'Press ▶ Play or step through with the arrows below.';
      ballMarker.style.left = leftPctFor(50) + '%';
      ballGhost.style.left = leftPctFor(50) + '%';
      firstDownLine.style.display = 'none';
      losLine.style.display = 'none';
      currentLine.style.display = 'none';
      document.getElementById('tdBanner').classList.remove('show');
      renderBoxScore(-1);
      return;
    }

    const step = timeline[stepIndex];
    const p = step.play;
    const after = step.after;
    const before = step.before;
    // Nathan: "show the clip along with the field graphic in playback
    // mode." Auto-seeks whenever this step has a marker AND actually
    // differs from wherever the player currently sits -- the equality
    // check matters because scrubbing quickly (or hitting Play) fires
    // renderStep repeatedly, and re-seeking to the same spot on every one
    // of those would visibly stutter the video for no reason.
    // Nathan: "this whole feature isn't working well" -- Drive is back to
    // a plain /preview embed, which can't be seeked programmatically at
    // all, so auto-jump only works for YouTube-hosted film right now.
    if (p.filmTimestamp != null && filmKind === 'youtube' && ytPlayer && typeof ytPlayer.seekTo === 'function'){
      try {
        const current = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : null;
        if (current == null || Math.abs(current - p.filmTimestamp) > 1.5) ytPlayer.seekTo(p.filmTimestamp, true);
      } catch(e){ /* player not fully ready yet -- next step's render will just try again */ }
    }
    document.getElementById('scoreUs').textContent = after.us;
    document.getElementById('scoreOpp').textContent = after.opp;
    document.getElementById('quarterLabel').textContent = quarterLabel(after.quarter);
    document.getElementById('ddDown').textContent = ['1st','2nd','3rd','4th'][after.down-1] || '1st';
    document.getElementById('ddSpot').textContent = spotLabelAbs(after.spot);
    document.getElementById('ddDist').textContent = after.distance + ' to go';
    document.getElementById('stepMeta').textContent = quarterLabel(after.quarter) + ' · Play ' + (stepIndex+1) + ' of ' + timeline.length;

    const sideTag = p.side ? '<span class="tag '+(p.side==='offense'?'off':'def')+'">'+(p.side==='offense'?'OFF':'DEF')+'</span>' : '';
    const spotBadge = spotBadgeText(p);
    const spotTag = spotBadge ? '<span class="tag spotTag">📍'+escapeHtml(spotBadge)+'</span>' : '';
    const dndBadge = downDistBadgeText(p);
    const dndTag = dndBadge ? '<span class="tag dndTag">'+escapeHtml(dndBadge)+'</span>' : '';
    document.getElementById('playTagsLine').innerHTML = sideTag + '<span class="tag">'+escapeHtml(p.type)+'</span>' + dndTag + spotTag;
    document.getElementById('playDesc').textContent = describePlay(p);

    // Nathan: "When touchdowns are scored there should be more
    // notification that it's a score." Only actual touchdowns (not PATs/
    // 2-point tries, which also flow through scoreDeltaFor but aren't
    // p.td) trigger this -- reusing the same delta logic the score bug and
    // box score already compute from, so "was this a TD" never drifts out
    // of sync with what actually changed the score.
    const tdBanner = document.getElementById('tdBanner');
    if (p.td){
      const delta = scoreDeltaFor(p);
      tdBanner.textContent = delta.us > 0 ? '🏆 BENGALS TOUCHDOWN!' : '🏆 OPPONENT TOUCHDOWN';
      tdBanner.classList.remove('show');
      void tdBanner.offsetWidth; // restart the pop-in animation even if the last play was also a TD
      tdBanner.classList.add('show');
    } else {
      tdBanner.classList.remove('show');
    }

    ballMarker.style.left = leftPctFor(after.spot) + '%';
    ballGhost.style.left = leftPctFor(after.spot) + '%';
    // Nathan: "Lines on the field should show the original line of
    // scrimmage, the current line of the ball, and the 1st down marker."
    // LOS is this play's OWN start spot (step.before.spot) -- for a
    // possession-change play (kickoff, punt, turnover) "before" isn't
    // really a line of scrimmage in the football sense, so it's hidden
    // rather than showing a misleading line.
    const hasScrimmage = p.type === 'run' || p.type === 'pass' || p.type === 'tackle' || p.type === 'kneel' || p.type === 'penalty';
    if (hasScrimmage){
      losLine.style.display = '';
      losLine.style.left = leftPctFor(before.spot) + '%';
    } else {
      losLine.style.display = 'none';
    }
    currentLine.style.display = '';
    currentLine.style.left = leftPctFor(after.spot) + '%';
    // Nathan: "show the progression on the field" -- the yellow first-down
    // marker is only meaningful when we actually know which direction
    // this team is driving (see advanceDownDistanceForPlay's own
    // forward100 reasoning); possession-change plays don't carry that, so
    // the marker just hides rather than show a guess.
    // Nathan: "the first down marker on the field should remain in place
    // until a 1st down or a change of possession." It used to only know
    // how to compute a direction for Run/Pass/Tackle/Kneel specifically
    // (a per-type ternary that fell through to `null`, i.e. hide the
    // marker entirely, for everything else) -- so it visibly vanished on
    // every Penalty, Turnover, Kick, and Punt step instead of just holding
    // its spot. `p.side` ('offense'/'defense') already exists on every
    // play type uniformly, so deriving direction from that instead covers
    // all of them the same way. The marker itself is just
    // after.spot + after.distance in that direction -- which is
    // ALWAYS the same fixed field position across an entire set of downs
    // by definition (spot and distance move together), so it only visibly
    // moves when a play actually resets them: a real first down, or a
    // change of possession (kickoff/punt/turnover, or a penalty with
    // Automatic 1st Down).
    const dir = p.side === 'offense' ? true : p.side === 'defense' ? false : null;
    if (dir == null){
      firstDownLine.style.display = 'none';
    } else {
      const firstDownAbs = dir ? clampSpot(after.spot + after.distance) : clampSpot(after.spot - after.distance);
      firstDownLine.style.display = '';
      firstDownLine.style.left = leftPctFor(firstDownAbs) + '%';
    }
    renderBoxScore(stepIndex);
  }

  function stepTo(i){
    stepIndex = Math.max(-1, Math.min(timeline.length - 1, i));
    renderStep();
  }
  document.getElementById('prevBtn').addEventListener('click', function(){ stopPlaying(); stepTo(stepIndex - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ stopPlaying(); stepTo(stepIndex + 1); });
  document.getElementById('scrubSlider').addEventListener('input', function(e){ stopPlaying(); stepTo(Number(e.target.value)); });

  function stopPlaying(){
    if (playTimer){ clearInterval(playTimer); playTimer = null; }
    document.getElementById('playPauseBtn').textContent = '▶ Play';
  }
  function startPlaying(){
    if (stepIndex >= timeline.length - 1) stepIndex = -1; // replay from the top if already at the end
    document.getElementById('playPauseBtn').textContent = '⏸ Pause';
    playTimer = setInterval(function(){
      if (stepIndex >= timeline.length - 1){ stopPlaying(); return; }
      stepTo(stepIndex + 1);
    }, playSpeedMs);
  }
  document.getElementById('playPauseBtn').addEventListener('click', function(){
    if (playTimer) stopPlaying(); else startPlaying();
  });
  document.querySelectorAll('.speedChip').forEach(function(chip){
    chip.addEventListener('click', function(){
      document.querySelectorAll('.speedChip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      playSpeedMs = Number(chip.dataset.ms);
      if (playTimer){ stopPlaying(); startPlaying(); }
    });
  });

  // Nathan: "bengals logo is missing on the game tracker." Most likely
  // cause is just where this file ends up living -- assets/images/... is
  // a RELATIVE path, same one schedule.js's own bengalsBadgeHtml() uses,
  // so it only resolves if this file sits in the same folder as index.html
  // (dev2/), right alongside the real assets/ folder. If it's been placed
  // somewhere else (a subfolder, a different path), that request 404s.
  // This won't fix a genuinely wrong deploy location, but it means a
  // missing/broken logo degrades to a branded fallback badge (same
  // colored-badge idea opponents without a logo on file already get)
  // instead of a broken-image icon.
  (function(){
    const usLogo = document.getElementById('usLogo');
    if (usLogo) usLogo.addEventListener('error', function(){
      usLogo.outerHTML = '<div class="teamLogo fallback" id="usLogo" style="background:var(--bengal-orange);">BEN</div>';
    });
  })();

  async function boot(){
    loadStatus.textContent = 'Signing in…';
    let ok = false;
    try { ok = await ensureViewerAuth(); } catch(e){ ok = false; }
    if (!ok){ loadStatus.textContent = 'Sign-in required — reload the page to try again.'; return; }
    loadStatus.textContent = 'Loading games…';
    try {
      const schedUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/schedule.json');
      const res = await fetch(schedUrl);
      const games = res.ok ? (await res.json() || []) : [];
      liveGamesCache = Array.isArray(games) ? games.filter(function(g){ return g && g.id; }) : [];
    } catch(e){ loadStatus.textContent = '⚠️ Could not load games: ' + e.message; return; }
    // Nathan: "Team logos should be used in the header." Same source
    // schedule.js's own badges read from -- uploaded once per opponent,
    // reused for every game against them.
    try {
      const logoUrl = await firebaseAuthedUrl(FIREBASE_DB_URL + '/opponentLogos.json');
      const logoRes = await fetch(logoUrl);
      const logoData = logoRes.ok ? (await logoRes.json()) : null;
      opponentLogos = (logoData && typeof logoData === 'object') ? logoData : {};
    } catch(e){ opponentLogos = {}; } // logos are cosmetic -- never worth blocking the whole page over
    populateGameSelect();
    loadStatus.textContent = liveGamesCache.length ? 'Select a game above to watch it back.' : 'No games found on the schedule yet.';
  }
  boot();
})();
</script>
</body>
</html>
