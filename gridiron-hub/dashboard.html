<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Hub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script>(function(){var t=localStorage.getItem('gridironHubTheme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--ink);font-family:'Karla',sans-serif;color:var(--text);}
  h1,h2{font-family:'Anton',sans-serif;font-weight:400;margin:0;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:32px;height:32px;}
  .brand span{font-family:'Anton',sans-serif;font-size:16px;}
  #signOutBtn{background:none;border:1px solid var(--line);color:var(--text-dim);padding:7px 14px;border-radius:5px;font-size:13px;cursor:pointer;}
  main{max-width:520px;margin:0 auto;padding:60px 24px;text-align:center;}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:32px;margin-top:24px;text-align:left;}
  .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row span:first-child{color:var(--text-dim);}
  .pending{color:var(--orange);font-weight:700;}
  .loading{color:var(--text-dim);text-align:center;padding:60px 0;}
</style>
</head>
<body>

  <header>
    <div class="brand"><img src="assets/img/tiger-logo.png" alt=""><span>GRIDIRON HUB</span></div>
    <button id="signOutBtn">Sign Out</button>
  </header>

  <main>
    <div id="loading" class="loading">Loading…</div>
    <div id="content" style="display:none;">
      <h1>Welcome</h1>
      <div class="card">
        <div class="row"><span>Email</span><span id="fEmail"></span></div>
        <div class="row"><span>Role</span><span id="fRole"></span></div>
        <div class="row"><span>Organization</span><span id="fOrg"></span></div>
      </div>
    </div>
  </main>

<script type="module">
  import { auth, db } from 'src/firebase-config.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  const loadingEl = document.getElementById('loading');
  const contentEl = document.getElementById('content');

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // Not signed in -- send back to login rather than showing an empty dashboard.
      window.location.href = 'login.html';
      return;
    }
    const snap = await getDoc(doc(db, 'users', user.uid));
    const data = snap.exists() ? snap.data() : {};

    document.getElementById('fEmail').textContent = data.email || user.email;
    // role/orgId are null until an org admin assigns this person somewhere --
    // that assignment flow doesn't exist yet, so this is the honest current
    // state rather than a placeholder value pretending otherwise.
    document.getElementById('fRole').textContent = data.role || 'Not yet assigned';
    document.getElementById('fRole').className = data.role ? '' : 'pending';
    document.getElementById('fOrg').textContent = data.orgId || 'Not yet assigned';
    document.getElementById('fOrg').className = data.orgId ? '' : 'pending';

    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';
  });

  document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));
</script>

<script src="assets/js/theme.js"></script>
</body>
</html>
